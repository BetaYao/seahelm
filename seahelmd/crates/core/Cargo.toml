[package]
name = "seahelm-core"
description = "seahelm's agent-status service: hooks and screens in, pane and worktree state out, over JSON-RPC"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
regex = "1"
seahelmd = { path = "../seahelmd" }
seahelm-core-types = { path = "../core-types" }
seahelm-core-hooks = { path = "../core-hooks" }
seahelm-core-scan = { path = "../core-scan" }
seahelm-core-registry = { path = "../core-registry" }
seahelm-core-messages = { path = "../core-messages" }
seahelm-core-command = { path = "../core-command" }
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }

[dev-dependencies]
tempfile = "3"
