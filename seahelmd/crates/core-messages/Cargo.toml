[package]
name = "seahelm-core-messages"
description = "Per-pane message timelines for seahelm-core: what the user said, what the agent did and said, decisions and turns"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
seahelm-core-types = { path = "../core-types" }
seahelm-core-hooks = { path = "../core-hooks" }
seahelm-core-scan = { path = "../core-scan" }
seahelm-core-registry = { path = "../core-registry" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
