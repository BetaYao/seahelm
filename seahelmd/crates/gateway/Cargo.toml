[package]
name = "seahelm-gateway"
description = "seahelm's network face: web access (pairing, auth, WebSocket, terminal relay) and the Telegram adapter, as a client of seahelm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "seahelm-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
seahelmd = { path = "../seahelmd" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
percent-encoding = "2"
regex = "1"
fancy-regex = "0.14"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
