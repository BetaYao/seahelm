[package]
name = "seahelm-core-scan"
description = "Screen-scan status detection for seahelm-core: agent manifests, the detector, debounce, process identification"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
seahelm-core-types = { path = "../core-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
