[package]
name = "seahelmd"
description = "Session daemon for seahelm: owns each pane's PTY and outlives the app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
keep-vt = { path = "../keep-vt" }
portable-pty = "0.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Windows port: named pipes (platform/windows/pipe.rs), process names and
# directories (winproc.rs), the console (console.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
