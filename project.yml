name: seahelm
options:
  bundleIdPrefix: com.seahelm
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.1"
  minimumXcodeGenVersion: "2.40"
  defaultConfig: Debug

packages:
  # NOTE: upstream CodeEditApp appears to have stopped work on both of the packages
  # below — no commits since ~April 2026, and the last releases are 0.15.2 (Sep 2025)
  # for CodeEditSourceEditor and 0.12.1 (Jul 2025) for CodeEditTextView. Don't go
  # looking for a newer version to pick up a fix; there won't be one. See the fork
  # note on CodeEditTextView. We keep it anyway because it is the only MIT-licensed,
  # AppKit-native, tree-sitter-backed editor component that exists — the one actively
  # maintained alternative (krzyzanowskim/STTextView) is GPLv3-or-paid, which a
  # closed-source notarized app can't take.
  CodeEditSourceEditor:
    url: https://github.com/CodeEditApp/CodeEditSourceEditor
    exactVersion: 0.15.2
  # Fork of CodeEditApp/CodeEditTextView, the text engine CodeEditSourceEditor sits on.
  # Upstream clamps the drag pointer to x >= 0, but the layout manager can only resolve
  # offsets at x >= edgeInsets.left — the strip the gutter is drawn over. Positions
  # further left returned nil, which made mouseDragged bail early and drop the whole
  # event, so a drag toward the top-left froze the selection a few characters into the
  # top line. Fixed in BetaYao@543f214 by clamping into the inset region instead.
  #
  # Declared here purely to override the transitive dependency: CodeEditSourceEditor
  # asks for `from: "0.12.1"`, and SPM resolves both to the same package identity, so
  # our 0.12.2 wins. Rebase the fork on upstream if it ever ships again.
  CodeEditTextView:
    url: https://github.com/BetaYao/CodeEditTextView
    exactVersion: 0.12.2
  # Fork of CodeEditApp/CodeEditLanguages that links only the tree-sitter grammars
  # this app needs. Upstream's CodeLanguage.tsLanguage switch names all ~50, which
  # pulls every member of the static grammar archive into the binary — 95.7 MB of a
  # 138 MB release build. The fork returns nil for 12 unused languages (they still
  # render, as plain text); everything else is untouched.
  #
  # Tagged 0.1.20 on the fork because CodeEditSourceEditor pins that version exactly,
  # and SPM resolves both to the same package identity.
  CodeEditLanguages:
    url: https://github.com/BetaYao/CodeEditLanguages
    exactVersion: 0.1.20
  # Auto-update. Pinned to the same major that ghostty vendors (2.9.0), so the
  # reference implementation in ghostty/macos/Sources/Features/Update stays valid.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0
  # MQTT client for the remote-client backend (MqttChannel). EMQX-maintained,
  # delegate-style API fits the app; TCP+TLS product only (WS clients are the
  # Watch/web, not the Mac publisher). See docs/remote-clients-design.md §15.
  CocoaMQTT:
    url: https://github.com/emqx/CocoaMQTT
    from: 2.1.0

targets:
  seahelm:
    type: application
    platform: macOS
    info:
      path: seahelm-Info.plist
      properties:
        CFBundleName: Seahelm
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Shown in the "Seahelm wants to control Messages" prompt. Required —
        # without it the first Apple event from IMessageSender kills the app.
        NSAppleEventsUsageDescription: "Seahelm sends agent updates and replies to your iMessage conversations through Messages."
        # Sparkle. The feed URL is deliberately absent — UpdateCoordinator supplies
        # it per CPU arch at runtime, because we ship arch-specific zips and Sparkle
        # has no built-in arch filtering, so there is one appcast per arch.
        #
        # SUPublicEDKey is the EdDSA public half of the key whose private half signs
        # each appcast item. Generate the pair once with Sparkle's `generate_keys`
        # (it stores the private key in the login keychain), set the public half as
        # the SPARKLE_PUBLIC_ED_KEY repo variable and the private half as the
        # SPARKLE_PRIVATE_KEY secret. Empty means Sparkle refuses to start — the
        # correct failure mode, since an unverified feed is the whole attack.
        SUPublicEDKey: "$(SPARKLE_PUBLIC_ED_KEY)"
        SUEnableAutomaticChecks: true
        # Gmail OAuth client, baked in the same way as SUPublicEDKey above.
        # Empty in local Debug builds — GmailOAuthClientConfiguration falls
        # back to ~/.config/seahelm/gmail-oauth-client.json for local testing.
        # CI supplies the real values from GMAIL_OAUTH_CLIENT_ID/SECRET repo
        # secrets (see scripts/package_release.sh); they are not committed
        # here because there's no reason to hand them to every clone, even
        # though Google does not treat a Desktop-app client secret as
        # confidential.
        GmailOAuthClientID: "$(GMAIL_OAUTH_CLIENT_ID)"
        GmailOAuthClientSecret: "$(GMAIL_OAUTH_CLIENT_SECRET)"
    dependencies:
      - package: CodeEditSourceEditor
        product: CodeEditSourceEditor
      # Listed so XcodeGen emits the package reference that overrides the transitive
      # pin. Already linked via CodeEditSourceEditor; naming it here adds no code.
      - package: CodeEditTextView
        product: CodeEditTextView
      - package: CodeEditLanguages
        product: CodeEditLanguages
      - package: Sparkle
        product: Sparkle
      - package: CocoaMQTT
        product: CocoaMQTT
      - package: CocoaMQTT
        product: CocoaMQTTWebSocket
      # Media preview backends. AVKit auto-links SwiftUICore, which can only be
      # linked through SwiftUI — so SwiftUI must be explicit here or the link
      # fails with "not an allowed client of it".
      - sdk: SwiftUI.framework
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: QuickLookUI.framework
    preBuildScripts:
      - name: "Embed and sign bundled zmx"
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          RES="${CODESIGNING_FOLDER_PATH}/Contents/Resources/bin"
          "${SRCROOT}/scripts/fetch-zmx.sh" "${RES}/zmx"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            # Release builds need a secure timestamp for notarization; skip it in
            # Debug so local builds don't pay a network round-trip per sign.
            TS="--timestamp"
            [ "${CONFIGURATION:-Debug}" = "Debug" ] && TS="--timestamp=none"
            codesign --force --options runtime $TS \
              --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "${RES}/zmx"
          fi
    postBuildScripts:
      # libghostty derives TERMINFO as a SIBLING of GHOSTTY_RESOURCES_DIR
      # (dirname(resources_dir)/terminfo — see ghostty/src/termio/Exec.zig).
      # Our terminfo ships inside Resources/ghostty/terminfo, so mirror it to
      # Resources/terminfo or TERM=xterm-ghostty is unresolvable on machines
      # without a standalone Ghostty.app install (garbled ZLE redraws).
      - name: "Mirror terminfo beside ghostty resources"
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          RES="${CODESIGNING_FOLDER_PATH}/Contents/Resources"
          rm -rf "${RES}/terminfo"
          cp -R "${RES}/ghostty/terminfo" "${RES}/terminfo"
      # HostGatewayServer serves this directory at `/`, same origin as `/ws`.
      # Copied by script rather than as a folder reference because devbroker/ is
      # a 17MB dev-only MQTT harness that has no business in the shipped bundle.
      - name: "Bundle seahelm-web client"
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/clients/seahelm-web"
          DEST="${CODESIGNING_FOLDER_PATH}/Contents/Resources/seahelm-web"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          rsync -a \
            --exclude 'devbroker' --exclude '.gitignore' --exclude 'README.md' \
            "${SRC}/" "${DEST}/"
    sources:
      - path: Sources
        type: group
      - path: Resources/Fonts
      - path: Resources/ghostty.conf
      - path: Resources/zmx-attach.py
      - path: Assets.xcassets
      - path: Resources/licenses
        type: folder
        buildPhase: resources
      - path: Resources/Manifests
        type: folder
        buildPhase: resources
      # Ghostty themes/terminfo — required for light/dark `theme = light:…,dark:…` switching.
      - path: Resources/ghostty
        type: folder
        buildPhase: resources
      - path: ghostty.h
        type: file
        buildPhase: none
      - path: seahelm-Bridging-Header.h
        type: file
        buildPhase: none
    settings:
      base:
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.seahelm.app
        # Drives the bundle name, the executable, and CFBundleName — i.e. what the
        # menu bar, About box and Finder all call the app. The target/scheme stay
        # lowercase so seahelm.xcodeproj and every documented build command keep
        # working; only the product users see is capitalised.
        PRODUCT_NAME: Seahelm
        # The Swift module name defaults to PRODUCT_NAME, which would rename the
        # module to `Seahelm` and break `@testable import seahelm` in every test
        # file. Pin it: the module is an internal name, and capitalising the app is
        # a user-facing change that has no business churning imports.
        PRODUCT_MODULE_NAME: seahelm
        GENERATE_INFOPLIST_FILE: NO
        # Sparkle's keys can't ride on GENERATE_INFOPLIST_FILE: Xcode only honours
        # INFOPLIST_KEY_* for keys it knows about and silently drops the rest, so
        # the plist is generated by xcodegen (see `info:` below) instead.
        # Public half of the EdDSA pair; the private half lives in the login
        # keychain (and in the SPARKLE_PRIVATE_KEY repo secret). Public by design —
        # it ships inside every app bundle so the client can verify the feed.
        SPARKLE_PUBLIC_ED_KEY: "Jfw9OUu27+LJNKOa9RxZJf70cGSyQXCetbWKF9bBxds="
        # Defaults empty; package_release.sh overrides these for release builds.
        GMAIL_OAUTH_CLIENT_ID: ""
        GMAIL_OAUTH_CLIENT_SECRET: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0.49"
        CURRENT_PROJECT_VERSION: 1
        # Local builds sign with the same Developer ID as the shipped app, and
        # deliberately not ad-hoc. TCC pins a Full Disk Access grant to a code
        # requirement; for an ad-hoc bundle that requirement is its cdhash, so
        # every rebuild invalidates the grant and the iMessage bridge goes deaf
        # with nothing in the UI to say why ("Failed to match existing code
        # requirement" is a tccd log line, not a prompt). Signed with the team
        # identity, the requirement is identity-based and one grant covers both
        # this build and /Applications.
        #
        # Manual, not Automatic: automatic resolves to an "Apple Development"
        # cert, and the ones in this keychain are revoked.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 43G5A6G9QV
        CODE_SIGN_IDENTITY: "Developer ID Application"
        # Hardened-runtime exceptions only — the app is not sandboxed. Needed so
        # signed builds can drive Messages.app for the iMessage bridge.
        CODE_SIGN_ENTITLEMENTS: seahelm.entitlements
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_OBJC_BRIDGING_HEADER: "$(PROJECT_DIR)/seahelm-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/GhosttyKit.xcframework/macos-arm64_x86_64"
        OTHER_LDFLAGS:
          # Linked by path, not `-lghostty`: upstream renamed the archive to
          # `ghostty-internal.a` (to distinguish it from the newer public
          # `libghostty-vt`), and without a `lib` prefix there is no `-l` form
          # for it that Apple's linker accepts.
          - "$(PROJECT_DIR)/GhosttyKit.xcframework/macos-arm64_x86_64/ghostty-internal.a"
          - "-lc++"
          - "-framework"
          - Metal
          - "-framework"
          - QuartzCore
          - "-framework"
          - IOSurface
          - "-framework"
          - UniformTypeIdentifiers
          - "-framework"
          - Carbon
      configs:
        Release:
          # package_release.sh runs `xcodebuild build`, not `install`, so Xcode's
          # default STRIP_INSTALLED_PRODUCT never fires and the shipped binary kept
          # its full symbol table — 14 MB of the zip. Strip explicitly instead.
          # non-global keeps exported symbols, so crash reports still symbolicate
          # against the linked frameworks.
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: non-global

  seahelmTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        type: group
    dependencies:
      - target: seahelm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seahelm.tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen derives TEST_HOST from the *target* name, assuming PRODUCT_NAME
        # matches it. Ours doesn't — the target stays `seahelm` so the scheme and
        # every documented xcodebuild command keep working, while the product users
        # see is `Seahelm`. Without this override the generated host path points at
        # a bundle that is never built and `xcodebuild test` cannot launch.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Seahelm.app/Contents/MacOS/Seahelm"

  seahelmUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
        type: group
    dependencies:
      - target: seahelm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seahelm.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: seahelm
