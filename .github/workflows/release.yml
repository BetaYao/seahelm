name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # GhosttyKit is the dominant cost of a release (~7.5 min from source) and its
  # macOS slice is universal, so both arch jobs consume the identical artifact.
  # Building it once here instead of inside the matrix halves that cost, and
  # keeps the two arch jobs from racing to save the same cache key (the loser's
  # save is silently dropped).
  ghostty:
    name: GhosttyKit
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.ghostty.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Must match the arch jobs: Ghostty's cimport of CoreVideo fails to find
      # kCVPixelFormatType_30RGB_r210 against a newer SDK than 16.1's.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.1"

      - name: Resolve Ghostty commit
        id: ghostty
        # The pinned commit plus the local patches setup.sh applies on top of
        # it (scripts/ghostty-patches), so editing a patch is a cache miss.
        run: echo "sha=$(git ls-tree HEAD ghostty | awk '{print $3}')-$(cat scripts/ghostty-patches/*.patch 2>/dev/null | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/seahelm/ghosttykit
          key: ghosttykit-${{ steps.ghostty.outputs.sha }}
          # A miss on the exact sha still restores the previous build, so zig
          # reuses its intermediates instead of starting cold.
          restore-keys: ghosttykit-

      # Read the version Ghostty itself requires rather than pinning one here.
      # A submodule bump that raises the minimum otherwise fails the release with
      # a zig error that looks like a Ghostty bug — which is exactly how v2.0.46
      # broke.
      - name: Resolve required Zig version
        id: zigver
        run: |
          v=$(sed -n 's/.*minimum_zig_version = "\([^"]*\)".*/\1/p' ghostty/build.zig.zon | head -1)
          [ -n "$v" ] || { echo "no minimum_zig_version in ghostty/build.zig.zon" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "ghostty requires zig $v"

      - name: Install Zig
        if: steps.cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zigver.outputs.version }}

      - name: Build GhosttyKit.xcframework
        run: ./scripts/setup.sh

  build:
    name: Build ${{ matrix.arch }}
    needs: ghostty
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      HAS_CERTIFICATE_SECRETS: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_DEVELOPER_IDENTITY != '' }}
      HAS_NOTARY_SECRETS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          # macos-13 was the last Intel runner and was retired in Dec 2025, so the
          # x86_64 slice is cross-compiled on Apple Silicon. GhosttyKit's macOS
          # slice is universal (macos-arm64_x86_64), so it links either way.
          - arch: x86_64
            runner: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.1"

      # seahelmd — the session daemon bundled as Resources/bin/seahelmd — is
      # built from source by the app's "Embed and sign seahelmd" phase
      # (scripts/build-seahelmd.sh) for this job's arch. It links libghostty-vt,
      # built with Zig from the Ghostty commit seahelmd/vendor/build-vt.sh pins
      # and cached here by that script's hash; Zig is only needed on a miss.
      - name: Cache libghostty-vt
        id: vtcache
        uses: actions/cache@v5
        with:
          path: ~/.cache/seahelm/libghostty-vt
          key: libghostty-vt-${{ matrix.arch }}-${{ hashFiles('seahelmd/vendor/build-vt.sh') }}

      - name: Install Zig
        if: steps.vtcache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          # The pinned Ghostty commit's minimum_zig_version.
          version: 0.16.0

      - name: Rust target for ${{ matrix.arch }}
        run: rustup target add ${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

      - name: Import Developer ID certificate
        if: ${{ env.HAS_CERTIFICATE_SECRETS == 'true' }}
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/seahelm-signing.keychain-db"
          openssl base64 -d -A -out "$CERT_PATH" <<< "$APPLE_CERTIFICATE_P12"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Configure notarytool credentials
        if: ${{ env.HAS_NOTARY_SECRETS == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "seahelm-notarytool" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      - name: Restore GhosttyKit
        # The `ghostty` job has already populated this key, so this is a hit.
        # Restore-only: the arch jobs must never race to write it. Artifacts
        # would be the obvious alternative, but upload-artifact flattens the
        # symlinks inside an xcframework.
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/seahelm/ghosttykit
          key: ghosttykit-${{ needs.ghostty.outputs.sha }}
          fail-on-cache-miss: true

      - name: Link GhosttyKit
        # Cache is populated, so this only symlinks it into the repo and syncs
        # ghostty.h — no zig, no build.
        run: ./scripts/setup.sh

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: spm-

      - name: Build release artifact
        env:
          ARCH: ${{ matrix.arch }}
          # The tag being released, so the app reports the version it shipped as.
          # workflow_dispatch has no tag; the build then keeps project.yml's value.
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          ENABLE_NOTARIZATION: ${{ env.HAS_CERTIFICATE_SECRETS == 'true' && env.HAS_NOTARY_SECRETS == 'true' && '1' || '0' }}
          NOTARYTOOL_PROFILE: seahelm-notarytool
          # Signs the appcast entry. Must stay in the macOS job: the publish job
          # runs on ubuntu and has no Sparkle tooling, and the key should not
          # travel further than the step that needs it.
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          # Baked into Info.plist so the shipped app works without users
          # creating their own Google Cloud OAuth client. Empty is a valid,
          # safe default — it just ships with Gmail unconfigured.
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
        run: ./scripts/package_release.sh

      - name: Upload packaged app
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/seahelm-macos-${{ matrix.arch }}.zip
            dist/appcast-${{ matrix.arch }}.xml
          if-no-files-found: error

  # The GPUI client (clients/gpui) with the daemons it starts beside it:
  # seahelmd, seahelm-core, seahelm-gateway, the seahelm CLI and seahelm-hook.
  # The client finds them in its own directory. macOS ships "Seahelm GPUI.app"
  # (all of them in Contents/MacOS), signed and notarized; Windows and Linux
  # ship one unsigned folder. A failure here does not hold back the macOS
  # app's release (see publish).
  gpui:
    name: GPUI ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      HAS_CERTIFICATE_SECRETS: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_DEVELOPER_IDENTITY != '' }}
      HAS_NOTARY_SECRETS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
            zig_target: aarch64-macos
            vt_slice: libghostty-vt
            exe: ""
          - name: windows-x86_64
            runner: windows-latest
            zig_target: x86_64-windows-msvc
            vt_slice: libghostty-vt-windows-x86_64
            exe: ".exe"
          - name: linux-x86_64
            runner: ubuntu-22.04
            zig_target: x86_64-linux-gnu
            vt_slice: libghostty-vt-linux-x86_64
            exe: ""
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve Ghostty commit
        id: vt
        run: |
          c=$(sed -n 's/^COMMIT="\${GHOSTTY_COMMIT:-\([0-9a-f]*\)}"$/\1/p' seahelmd/vendor/build-vt.sh)
          [ -n "$c" ] || { echo "no pinned commit in build-vt.sh" >&2; exit 1; }
          echo "commit=$c" >> "$GITHUB_OUTPUT"

      - name: Cache libghostty-vt
        id: vtcache
        uses: actions/cache@v5
        with:
          # keep-vt's default slice for the target: no KEEP_GHOSTTY_VT_DIR, so
          # no Windows drive path goes through Git Bash.
          path: seahelmd/vendor/${{ matrix.vt_slice }}
          key: gpui-libghostty-vt-${{ matrix.name }}-${{ steps.vt.outputs.commit }}

      - name: Install Zig
        if: steps.vtcache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build libghostty-vt
        if: steps.vtcache.outputs.cache-hit != 'true'
        run: seahelmd/vendor/build-vt.sh ${{ matrix.zig_target }} seahelmd/vendor/${{ matrix.vt_slice }}

      # What GPUI needs on Linux to build: X11/Wayland, xkbcommon, Vulkan,
      # fontconfig, ALSA.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang cmake libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libssl-dev libzstd-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: gpui-${{ matrix.name }}
          workspaces: |
            seahelmd
            clients/gpui

      - name: Build the daemons
        working-directory: seahelmd
        run: >
          cargo build --release --locked
          -p seahelmd -p seahelm-core -p seahelm-cli -p seahelm-gateway -p seahelm-core-hooks
          --bin seahelmd --bin seahelm-core --bin seahelm --bin seahelm-gateway --bin seahelm-hook

      - name: Build the client
        working-directory: clients/gpui
        run: cargo build --release --locked

      # macOS: "Seahelm GPUI.app", signed and notarized like the AppKit app.
      - name: Import Developer ID certificate
        if: ${{ runner.os == 'macOS' && env.HAS_CERTIFICATE_SECRETS == 'true' }}
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/seahelm-signing.keychain-db"
          openssl base64 -d -A -out "$CERT_PATH" <<< "$APPLE_CERTIFICATE_P12"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Configure notarytool credentials
        if: ${{ runner.os == 'macOS' && env.HAS_NOTARY_SECRETS == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "seahelm-notarytool" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"

      - name: Package the macOS app
        if: runner.os == 'macOS'
        env:
          DAEMON_DIR: seahelmd/target/release
          GPUI_BIN: clients/gpui/target/release/seahelm-gpui
          OUTPUT_PATH: dist/seahelm-gpui-${{ matrix.name }}.zip
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          SIGN_IDENTITY: ${{ env.HAS_CERTIFICATE_SECRETS == 'true' && secrets.APPLE_DEVELOPER_IDENTITY || '' }}
          ENABLE_NOTARIZATION: ${{ env.HAS_CERTIFICATE_SECRETS == 'true' && env.HAS_NOTARY_SECRETS == 'true' && '1' || '0' }}
          NOTARYTOOL_PROFILE: seahelm-notarytool
        run: |
          scripts/package_gpui_macos.sh
          echo "file=$OUTPUT_PATH" >> "$GITHUB_ENV"

      - name: Package
        if: runner.os != 'macOS'
        run: |
          name="seahelm-gpui-${{ matrix.name }}"
          mkdir -p "dist/$name"
          for bin in seahelmd seahelm-core seahelm seahelm-gateway seahelm-hook; do
            cp "seahelmd/target/release/$bin${{ matrix.exe }}" "dist/$name/"
          done
          cp "clients/gpui/target/release/seahelm-gpui${{ matrix.exe }}" "dist/$name/"
          cp clients/gpui/README.md "dist/$name/README.md"
          # Linux keeps the release profile's debug info inside the binaries
          # (macOS and Windows keep it beside them): 70 MB of a tarball that
          # needs a fraction of that to run.
          if [ "${{ runner.os }}" = Linux ]; then
            strip --strip-debug dist/$name/seahelm*
            du -sh "dist/$name"
          fi
          cd dist
          case "${{ runner.os }}" in
            Windows) 7z a -tzip "$name.zip" "$name" >/dev/null; echo "file=dist/$name.zip" >> "$GITHUB_ENV" ;;
            *)       tar -czf "$name.tar.gz" "$name"; echo "file=dist/$name.tar.gz" >> "$GITHUB_ENV" ;;
          esac
          ls -la

      # Windows: also a setup.exe (Inno Setup, per-user, Start menu entry,
      # uninstaller) built from the same folder.
      - name: Windows installer
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          version="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          version="${version#v}"
          [ -n "$version" ] || version="$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml | head -1)"
          src="$(cygpath -w "$PWD/dist/seahelm-gpui-${{ matrix.name }}")"
          out="$(cygpath -w "$PWD/dist")"
          cd clients/gpui/packaging/windows
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DSourceDir=$src" "/DAppVersion=$version" "/DOutputDir=$out" \
            "/DOutputBaseName=seahelm-gpui-${{ matrix.name }}-setup" seahelm-gpui.iss
          echo "setup=dist/seahelm-gpui-${{ matrix.name }}-setup.exe" >> "$GITHUB_ENV"
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: gpui-${{ matrix.name }}
          # No setup outside Windows: the package twice is the same file once.
          path: |
            ${{ env.file }}
            ${{ env.setup || env.file }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, gpui]
    runs-on: ubuntu-latest
    # Only publish for real tag pushes. On workflow_dispatch (or any branch run)
    # github.ref_name is the branch, and action-gh-release defaults tag_name to
    # it — which would mint a bogus "main" release. Dispatch still builds both
    # arches for verification; it just stops before publishing.
    # The macOS app must have built; a GPUI platform that failed is left out.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}

    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Download GPUI packages
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          path: dist
          pattern: gpui-*
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/seahelm-macos-arm64.zip
            dist/seahelm-macos-x86_64.zip
            dist/appcast-arm64.xml
            dist/appcast-x86_64.xml
            dist/seahelm-gpui-*
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Install

            ### macOS (one-line install)

            ```bash
            curl -fsSL https://seahelm.dev/install.sh | sh
            ```

            ### macOS (manual)

            1. Download the zip for your Mac below and unpack it
               - `seahelm-macos-arm64.zip`: Apple Silicon
               - `seahelm-macos-x86_64.zip`: Intel
            2. Drag `Seahelm.app` into `/Applications`
            3. If macOS blocks the app on first launch, run:
               ```bash
               xattr -dr com.apple.quarantine /Applications/Seahelm.app
               ```
            4. Launch Seahelm

            ### GPUI client (macOS, Windows, Linux) — preview

            - macOS: `seahelm-gpui-macos-arm64.zip` holds `Seahelm GPUI.app`. Unpack it,
              drag it into Applications, open it.
            - Windows: run `seahelm-gpui-windows-x86_64-setup.exe` (installs for you only,
              no administrator rights; Start menu entry and uninstaller). Unsigned, so
              SmartScreen asks once ("More info" → "Run anyway"). The `.zip` beside it is
              the same files without an installer.
            - Linux: `seahelm-gpui-linux-x86_64.tar.gz` is a folder with the GPUI client and
              the daemons it starts (seahelmd, seahelm-core, seahelm-gateway, seahelm,
              seahelm-hook). Unpack it and run `seahelm-gpui` from that folder.

            Artifacts are notarized when the required Apple signing secrets are configured in this repository; the quarantine step is only needed for un-notarized builds.
