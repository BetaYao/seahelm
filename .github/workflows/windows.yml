name: Windows

# The Rust workspace (seahelmd and seahelm-core) on Windows: libghostty-vt
# (the release build-vt.sh pins) built with Zig against MSVC (it cannot be cross-compiled from macOS), then
# the whole workspace's tests, including seahelmd's end-to-end Windows tests
# (named pipes, ConPTY) and the pipe / process code ported from Keep. Then
# the GPUI client (clients/gpui, a workspace of its own) built and tested
# against the same library.

on:
  push:
    branches: [main]
    paths:
      - "seahelmd/**"
      - "clients/gpui/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "seahelmd/**"
      - "clients/gpui/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  test:
    name: seahelmd workspace on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The libghostty-vt release is pinned in build-vt.sh; it is the cache
      # key, so a bump rebuilds.
      - name: Resolve libghostty-vt version
        id: vt
        run: |
          v=$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' seahelmd/vendor/build-vt.sh)
          [ -n "$v" ] || { echo "no pinned version in build-vt.sh" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache libghostty-vt
        id: cache
        uses: actions/cache@v5
        with:
          path: seahelmd/vendor/libghostty-vt-windows-x86_64
          key: libghostty-vt-windows-x86_64-${{ steps.vt.outputs.version }}

      - name: Install Zig
        if: steps.cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          # libghostty-vt's minimum_zig_version.
          version: 0.17.0

      - name: Build libghostty-vt
        if: steps.cache.outputs.cache-hit != 'true'
        run: seahelmd/vendor/build-vt.sh x86_64-windows-msvc seahelmd/vendor/libghostty-vt-windows-x86_64

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            seahelmd
            clients/gpui

      # A hung daemon test should fail the job, not hold the runner for an hour.
      - name: Test
        timeout-minutes: 15
        working-directory: seahelmd
        run: cargo test --locked --workspace --no-fail-fast

      # The client: the window itself is not exercised (no display), but it
      # has to build with Windows' GPUI (DirectX) and the named-pipe
      # transport, and its unit tests run.
      - name: GPUI client
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        working-directory: clients/gpui
        run: cargo test --locked
