<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seahelm · cockpit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230e2d37'/%3E%3Ccircle cx='8' cy='8' r='4' fill='none' stroke='%231fc8da' stroke-width='1.6'/%3E%3Ccircle cx='8' cy='8' r='1.2' fill='%231fc8da'/%3E%3C/svg%3E" />
<!-- Plain static page: WS/WSS to the same-origin Host Gateway. No external deps, works offline. -->
<style>
  /* Bare-TUI cockpit — matches Sources/UI/Shared/SemanticColors.swift (dark) */
  :root{
    --bg:#08222a;
    --panel:#0e2d37;
    --panel2:#103440;
    --text:#cfe0e0;
    --muted:#7fa0a3;
    --line:#96d7e1;
    --accent:#1fc8da;
    --running:#1bb062;
    --waiting:#5b93f0;
    --idle:#557170;
    --danger:#e84635;
    --attention:#e0a458;
    --line-12:rgba(150,215,225,.12);
    --line-20:rgba(150,215,225,.20);
    --line-38:rgba(150,215,225,.38);
    --accent-12:rgba(31,200,218,.12);
    --accent-20:rgba(31,200,218,.20);
    --running-14:rgba(27,176,98,.14);
    --danger-14:rgba(232,70,53,.14);
    --attention-12:rgba(224,164,88,.12);
    /* A bare terminal, as opposed to an agent. Not amber: that is "needs you". */
    --shell:#b3a4f2;
    --shell-38:rgba(179,164,242,.38);
    --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Segoe UI','Microsoft YaHei',sans-serif;
    --r:4px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  ::selection{background:var(--accent-20);color:var(--text)}
  body{
    background:var(--bg);color:var(--text);font-family:var(--mono);height:100vh;
    display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;
    font-size:13px;line-height:1.4;
    background-image:radial-gradient(120% 80% at 50% -10%, #0c303a 0%, var(--bg) 55%);
  }
  /* ── header ─────────────────────────────────────────────── */
  header{display:flex;gap:8px;align-items:center;padding:8px 12px;
    background:rgba(8,34,42,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-12);flex-wrap:wrap;min-height:40px}
  .wordmark{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.04em;
    color:var(--text);margin-right:4px;text-transform:lowercase}
  .wordmark .sea{color:var(--accent)}
  header input{background:var(--panel);border:1px solid var(--line-20);color:var(--text);
    border-radius:var(--r);padding:5px 8px;font-family:var(--mono);font-size:12px;outline:none}
  header input:focus{border-color:var(--accent)}
  header input.url{width:270px} header input.sm{width:92px}
  header button{background:var(--accent);color:#042028;border:0;border-radius:var(--r);
    padding:5px 12px;font-weight:600;cursor:pointer;font-size:12px;font-family:var(--mono);
    letter-spacing:.02em;transition:filter .12s}
  header button:hover{filter:brightness(1.08)}
  header button.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line-20)}
  header button.ghost.on{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
  .pairzone{display:flex;align-items:center;gap:8px}
  .spacer{flex:1}
  header button.pair-primary{font-weight:600;padding-left:14px;padding-right:14px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--accent-12);
    border:1px solid var(--line-38);border-radius:var(--r);padding:4px 6px 4px 10px;
    font-size:12px;color:var(--text)}
  .chip .lock{font-size:11px;opacity:.85}
  .chip b{font-family:var(--mono);font-weight:600;letter-spacing:.02em}
  .chip .chip-x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;
    line-height:1;padding:2px 4px;border-radius:3px;font-family:var(--mono)}
  .chip .chip-x:hover{color:var(--danger);background:var(--danger-14)}
  .advrow{display:flex;align-items:center;gap:8px}
  .advrow[hidden]{display:none}
  #status{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 8px;
    border-radius:var(--r);margin-left:auto;text-transform:uppercase}
  .st-off{background:var(--danger-14);color:var(--danger)}
  .st-on{background:var(--running-14);color:var(--running)}
  /* ── connection gate ────────────────────────────────────── */
  .gate{position:fixed;top:0;left:0;right:0;bottom:0;z-index:90;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:var(--bg);
    background-image:radial-gradient(120% 80% at 50% -10%, #0c303a 0%, var(--bg) 55%)}
  .gate[hidden]{display:none}
  .gate-card{width:min(440px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
  .gate-title{font-size:15px;font-weight:600;letter-spacing:.02em}
  .gate-hint{font-size:12px;color:var(--muted);line-height:1.5}
  .gate-input{width:100%;background:var(--panel);border:1px solid var(--line-20);
    color:var(--text);border-radius:var(--r);padding:10px;font-family:var(--mono);
    font-size:12px;outline:none;resize:vertical}
  .gate-input:focus{border-color:var(--accent)}
  .gate-primary{background:var(--accent);color:#042028;border:0;border-radius:var(--r);
    padding:11px 16px;font-weight:600;font-size:13px;font-family:var(--mono);cursor:pointer}
  .gate-primary:hover{filter:brightness(1.08)}
  .gate-link{background:none;border:0;color:var(--muted);font-family:var(--mono);
    font-size:11px;cursor:pointer;padding:4px}
  .gate-link:hover{color:var(--danger)}
  .gate-mac{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-size:13px;color:var(--text)}
  .gate-error{color:var(--danger);font-size:12px;line-height:1.5;text-align:left}
  .gate-error[hidden]{display:none}
  /* ── layout ─────────────────────────────────────────────── */
  main{flex:1;display:grid;grid-template-columns:300px 1fr 360px;overflow:hidden;
    transition:grid-template-columns .16s ease}
  /* Debug panel collapsed — the terminal takes the width back. */
  main.nolog{grid-template-columns:300px 1fr 0}
  main.nolog #rightcol{display:none}

  /* Narrow-layout affordances. These base rules must precede the media queries:
     same specificity means source order decides, and declaring them afterwards
     silently re-hid the drawer button at every width. */
  #drawerBtn{display:none;align-items:center;justify-content:center;
    background:var(--panel);color:var(--text);border:1px solid var(--line-20);
    border-radius:var(--r);padding:5px 9px;font-size:13px;line-height:1;cursor:pointer;
    font-family:var(--mono)}
  #drawerBtn:hover{border-color:var(--accent);color:var(--accent)}
  /* Panes other than the one on screen waiting on you. It rides the ☰ that
     leads to them rather than taking a row above the transcript: the count is
     usually zero, and permanent furniture for "usually nothing" is what cost
     the phone its reading height. */
  #drawerBtn{position:relative}
  #drawerBtn[data-waiting]{border-color:var(--attention)}
  #drawerBtn[data-waiting]::after{content:attr(data-waiting);position:absolute;
    top:-5px;right:-5px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;
    background:var(--attention);color:#08222a;font-family:var(--mono);font-size:9px;
    font-weight:600;line-height:15px;text-align:center}
  #scrim{display:none}

  /* ── responsive ───────────────────────────────────────────
     `main.nolog` outranks `main`, so every override below has to name both or
     the debug toggle would decide the narrow layout. */
  @media (max-width:1100px){
    main, main.nolog{grid-template-columns:260px 1fr 0}
    main #rightcol, main.nolog #rightcol{display:none}   /* no room to debug and work */
    #logBtn{display:none}
  }
  /* Phone / narrow window: one column, First Mate slides over it. */
  @media (max-width:760px){
    main, main.nolog{grid-template-columns:1fr}
    #drawerBtn{display:inline-flex}
    #leftcol{position:fixed;top:0;bottom:0;left:0;z-index:80;
      width:min(86vw,320px);background:var(--bg);
      border-right:1px solid var(--line-20);box-shadow:0 0 40px rgba(0,0,0,.55);
      transform:translateX(-101%);transition:transform .18s ease;will-change:transform}
    #leftcol.open{transform:none}
    #scrim{display:block;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);
      opacity:0;pointer-events:none;transition:opacity .18s ease}
    #scrim.on{opacity:1;pointer-events:auto}
    header{padding:6px 8px;gap:6px;min-height:36px}
    .wordmark{font-size:13px}
    .detail-head{margin:0 0 8px}
    .col{padding:8px}
    .suggest-dock{padding:calc(8px + env(safe-area-inset-top)) 8px 8px}
  }
  .col{overflow-y:auto;padding:12px;border-right:1px solid var(--line-12)}
  #midcol{display:flex;flex-direction:column;overflow:hidden}
  /* The terminal is the mid column now — there is nothing else to share it with. */
  #termWrap{flex:1 1 auto;min-height:0;background:#05090c;
    border:1px solid var(--line-12);border-radius:var(--r);padding:6px;overflow:auto}
  #term{width:100%;height:100%}
  /* Mirrored split tree. Slots are flex shares of the Mac's ratios; there are
     deliberately no drag handles — this is a mirror, and the panes belong to
     the machine that owns them. */
  .vt-split{display:flex;width:100%;height:100%;gap:5px;min-width:0;min-height:0}
  .vt-slot{display:flex;min-width:0;min-height:0}
  .vt-slot>*{flex:1 1 auto;min-width:0;min-height:0}
  .vt-leaf{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;
    border:1px solid var(--line-12);border-radius:var(--r);background:#05090c}
  .vt-leaf.on{border-color:var(--accent-20)}
  .vt-leaf-title{flex:none;font-size:10px;letter-spacing:.06em;color:var(--muted);
    padding:3px 7px;background:var(--panel);border-bottom:1px solid var(--line-12);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vt-leaf.on .vt-leaf-title{color:var(--accent)}
  .vt-host{flex:1 1 auto;min-height:0;min-width:0;overflow:hidden;touch-action:none}
  /* Single-pane fallback: the strip stands in for the panes we stopped drawing,
     so the layout is still legible even though only one of them is on screen. */
  .vt-single{flex:1 1 auto;min-height:0;min-width:0;display:flex}
  .vt-single>*{flex:1 1 auto;min-width:0;min-height:0}
  #termWrap:has(.vt-single){display:flex;flex-direction:column;gap:6px}
  .pane-strip{flex:none;display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
  .pane-chip{flex:none;display:inline-flex;align-items:center;gap:5px;
    background:var(--panel);color:var(--muted);border:1px solid var(--line-12);
    border-radius:var(--r);padding:4px 9px;font-family:var(--mono);font-size:11px;
    cursor:pointer;white-space:nowrap;max-width:46vw;overflow:hidden}
  .pane-chip.on{background:var(--accent-12);border-color:var(--line-38);color:var(--accent)}
  .pane-chip span{overflow:hidden;text-overflow:ellipsis}
  #termWrap.empty{display:flex;align-items:center;justify-content:center}
  /* Scrolled back in a live terminal, there is otherwise no way home but to
     swipe all the way down — and new output keeps arriving below you. */
  #toBottom{position:absolute;right:16px;bottom:16px;z-index:40;display:none;
    background:var(--panel2);color:var(--accent);border:1px solid var(--accent-20);
    border-radius:14px;padding:5px 12px;font-family:var(--mono);font-size:11px;
    cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  #toBottom.on{display:block}
  #midcol{position:relative}
  .col::-webkit-scrollbar{width:6px}
  .col::-webkit-scrollbar-thumb{background:var(--line-20);border-radius:3px}
  .col h2{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);margin:2px 0 10px;font-weight:500}
  .col h2:not(:first-child){margin-top:18px}
  .detail-head{display:flex;align-items:center;gap:8px;margin:2px 0 10px;flex:none}
  .detail-head h2{margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Keys the browser will not give us. Cmd+W closes the tab and cannot be
     intercepted by any page, so for those the button is not a convenience — it
     is the only way to reach the action at all. */
  .renderer-badge{flex:none;background:var(--panel);color:var(--muted);
    border:1px solid var(--line-12);border-radius:var(--r);padding:3px 7px;
    font-family:var(--mono);font-size:10px;letter-spacing:.04em;cursor:pointer}
  .renderer-badge:hover{border-color:var(--accent);color:var(--accent)}
  .renderer-badge.alt{color:var(--attention);border-color:var(--attention-12)}
  .term-keys{display:flex;gap:4px;flex:none;align-items:center;overflow-x:auto;max-width:55%}
  .term-keys button{flex:none;background:var(--panel);color:var(--muted);
    border:1px solid var(--line-12);border-radius:var(--r);padding:3px 7px;
    font-family:var(--mono);font-size:11px;line-height:1.2;cursor:pointer;white-space:nowrap}
  .term-keys button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .term-keys button:disabled{opacity:.35;cursor:default}
  .term-keys button.danger:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}
  .term-keys .sep{width:1px;height:14px;background:var(--line-20);flex:none;margin:0 2px}
  .action-toast{position:fixed;top:52px;right:14px;z-index:100;max-width:min(420px,calc(100vw - 28px));
    padding:8px 12px;border:1px solid var(--accent-20);border-radius:var(--r);
    background:var(--panel2);color:var(--accent);font-family:var(--mono);font-size:11px;
    box-shadow:0 4px 18px rgba(0,0,0,.45)}
  .action-toast.error{border-color:var(--danger);color:var(--danger)}
  .action-toast[hidden]{display:none}
  .detail-head button{flex:none;background:var(--panel);color:var(--text);border:1px solid var(--line-20);
    border-radius:var(--r);padding:5px 10px;font-family:var(--mono);font-size:11px;cursor:pointer;font-weight:600}
  .detail-head button:hover{border-color:var(--accent);color:var(--accent)}
  .detail-head button:disabled{opacity:.45;cursor:default;border-color:var(--line-12);color:var(--muted)}
  /* ── First Mate header (matches Mac DashboardOverviewView) ─ */
  #leftcol{display:flex;flex-direction:column;padding:0;overflow:hidden}
  .fm-scroll{flex:1;min-height:0;overflow-y:auto;padding:8px 10px 12px}
  .fm-header{display:flex;align-items:baseline;gap:10px;padding:10px 12px 8px;
    border-bottom:1px solid var(--line-12);flex:none}
  .fm-header .fm-glyph{color:var(--accent);font-size:13px;line-height:1}
  .fm-header .fm-title{font-size:12.5px;font-weight:700;color:var(--text);letter-spacing:.02em}
  .fm-header .fm-sub{font-size:11px;color:var(--muted);margin-left:2px}
  /* ── First Mate list ─────────────────────────────────────────
     Ported 1:1 from DashboardOverviewView (DashboardViewController.swift):
     group header mono 11 semibold inkDim with 13/7 gaps; rows 8pt radius,
     8/10 padding, 4 apart; dot column then a 3pt-spaced two-line text column.
     Colours are SemanticColors' dark values. */
  .fm-group{padding-top:13px}
  .fm-group:first-child{padding-top:0}
  .fm-group-head{display:flex;align-items:center;gap:7px;padding-bottom:7px;
    font-size:11px;font-weight:600;color:var(--muted)}
  .fm-group-head .fm-deck{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fm-add{flex:none;background:none;border:0;color:var(--muted);cursor:pointer;
    font-family:var(--mono);font-size:13px;line-height:1;padding:0 2px;border-radius:3px}
  .fm-add:hover{color:var(--accent)}
  .fm-modes{display:flex;gap:4px;margin:0 0 10px}
  .fm-modes button{flex:1;background:var(--panel);color:var(--muted);
    border:1px solid var(--line-12);border-radius:var(--r);padding:4px 0;
    font-family:var(--mono);font-size:11px;cursor:pointer}
  .fm-modes button.on{background:var(--accent-12);border-color:var(--line-38);color:var(--accent)}
  .fm-rows{display:flex;flex-direction:column;gap:4px}
  .fm-row{display:flex;gap:7px;padding:8px 10px;border-radius:8px;cursor:pointer;
    transition:background .12s}
  .fm-row:hover{background:rgba(255,255,255,.05)}
  .fm-row.sel{background:rgba(255,255,255,.10)}
  /* The dot sits in its own column so both text lines share one leading edge. */
  .fm-dot{flex:none;width:9px;display:flex;justify-content:center;align-items:center;
    height:17px;font-size:9px;line-height:1}
  /* `running` is a spinning 3/4 arc on the Mac (SpinnerDotView), not a glyph. */
  .fm-spin{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--running);
    border-right-color:transparent;animation:fmspin .9s linear infinite}
  @keyframes fmspin{to{transform:rotate(360deg)}}
  .fm-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .fm-l1{display:flex;align-items:center;gap:7px}
  .fm-name{flex:1;min-width:0;font-size:12px;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fm-time{flex:none;font-size:10px;color:var(--muted)}
  .fm-l2{display:flex;align-items:baseline;gap:8px}
  /* Both can truncate, but the deck gives way first — it is the one fact the
     group header above already tells you. Matches the Mac, where the deck label
     compresses to "teamc…" while the branch stays whole. */
  .fm-branch{flex:0 1 auto;min-width:0;flex-shrink:1;font-size:11px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fm-git{flex:none;font-size:10px;white-space:nowrap}
  .fm-git .add{color:#5fb87a} .fm-git .del{color:#e07a6a} .fm-git .ab{color:var(--muted)}
  .fm-sailors{flex:none;margin-left:auto;font-size:10px;color:var(--muted)}
  /* What runs in the pane: an agent's name, or `>_` for a bare terminal. */
  .fm-kind{flex:none;font-size:9.5px;line-height:14px;padding:0 5px;border-radius:4px;
    border:1px solid var(--line-12);color:var(--muted);white-space:nowrap}
  .fm-kind.agent{color:var(--accent);border-color:var(--accent-20)}
  .fm-kind.shell{color:var(--shell);border-color:var(--shell-38);font-family:var(--mono)}
  /* Shrinks first, but never to nothing — the Mac always keeps a stub ("teamc…"),
     and a row whose deck vanished entirely reads as if it had none. */
  .fm-deck-tag{flex:0 1 auto;min-width:2.6em;flex-shrink:4;font-size:10px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Third level (PaneRowView): indented 27px to clear the worktree dot+gutter. */
  .fm-pane{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 27px;
    border-radius:6px;cursor:pointer;transition:background .12s}
  .fm-pane:hover{background:rgba(255,255,255,.05)}
  .fm-pane.sel{background:rgba(255,255,255,.10)}
  .fm-pane .pdot{flex:none;font-size:7px;line-height:1}
  .fm-pane .ptitle{flex:1;min-width:0;font-size:11px;color:var(--muted);opacity:.78;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fm-pane.sel .ptitle,.fm-pane:hover .ptitle{opacity:1}
  /* ── suggestion dock ─────────────────────────────────────────
     Floats over the whole page at the upper centre — same place the Mac
     island opens its suggestion card — so a suggestion is reachable from any
     column without covering the terminal's latest output at the bottom. */
  .suggest-dock{position:fixed;left:0;right:0;top:0;z-index:60;
    display:flex;flex-direction:column;gap:8px;align-items:center;
    padding:calc(12px + env(safe-area-inset-top)) 12px 20px;
    background:linear-gradient(to bottom, rgba(6,26,32,.97) 55%, rgba(6,26,32,0));
    max-height:52vh;overflow-y:auto;pointer-events:none}
  .suggest-dock:empty{display:none}
  .suggest-dock>*{pointer-events:auto;width:100%;max-width:540px;
    animation:suggest-in .18s ease-out}
  @keyframes suggest-in{
    from{opacity:0;transform:translateY(-10px)}
    to{opacity:1;transform:translateY(0)}
  }
  /* ── event / suggestion cards ───────────────────────────── */
  .ev{background:var(--panel);border:1px solid var(--attention);
    border-radius:var(--r);padding:10px;margin-bottom:8px}
  .ev .eb{font-family:var(--mono);font-size:10px;color:var(--attention);text-transform:uppercase;
    letter-spacing:.16em;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .ev .ev-meta{font-size:10px;color:var(--muted);margin-top:2px}
  /* The dock floats over the terminal, so an agent that wrote three paragraphs
     before its options must not bury the thing it is asking. Clamped, with the
     full text one tap away in the pane itself. */
  .ev-x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;
    line-height:1;padding:2px 4px;border-radius:3px;font-family:var(--mono)}
  .ev-x:hover{color:var(--danger);background:var(--danger-14)}
  .ev .prompt{margin:6px 0 4px;font-size:12px;line-height:1.45;white-space:pre-wrap;
    display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
  .ev .opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line-20);
    color:var(--text);border-radius:var(--r);padding:7px 10px;margin-top:5px;cursor:pointer;font-size:12px;
    font-family:var(--mono);transition:border-color .1s}
  .ev .opt:hover{border-color:var(--accent)}
  .ev .opt:first-of-type{background:var(--accent-12);border-color:var(--accent-20)}
  .ev .opt b{font-family:var(--mono);color:var(--muted);margin-right:8px;font-weight:500}
  /* ── MessageStream text mode ─────────────────────────────── */
  /* Read like a transcript, not a stack of cards: no boxes, no side bars.
     Kinds are told apart by type — what you sent is a bubble on the right,
     tools are dim monospace, prose is set for reading. Everything else shares
     the left edge of the status rules, with no indent of its own. */
  #messageTimeline{display:none;flex:1;overflow:auto;padding:4px 16px 28px;flex-direction:column}
  #messageTimeline.on{display:flex}
  #termWrap.text-hidden{display:none}
  .tl{width:100%;max-width:760px;margin:0 auto}
  .tl-empty{padding:48px 0;text-align:center;color:var(--muted);font-size:12px}
  .tl-more{padding:10px 0 2px;text-align:center;font-size:11px;color:var(--idle)}
  .tl-status{display:flex;align-items:center;gap:8px;margin:20px 0 10px;
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--idle)}
  .tl-status::before,.tl-status::after{content:'';flex:1;height:1px;background:var(--line-12)}
  .tl-status i{width:5px;height:5px;border-radius:50%;flex:none}
  /* What you sent is the one thing on the right, and the one thing with a fill —
     so a long run of agent output never hides where a turn began. */
  .tl-user{display:flex;justify-content:flex-end;margin:18px 0 12px;padding-left:15%}
  .tl-user div{min-width:0;padding:9px 14px;border-radius:16px 16px 4px 16px;
    background:rgba(31,200,218,.26);color:#f4fdfe;font-family:var(--sans);
    font-size:14px;line-height:1.55;font-weight:500;white-space:pre-wrap;word-break:break-word}
  .tl-tool{display:flex;gap:8px;min-width:0;white-space:nowrap;
    font-family:var(--mono);font-size:12px;line-height:1.8;color:var(--muted)}
  .tl-tool b{flex:none;font-weight:500;color:#a8c3c5}
  .tl-tool span{overflow:hidden;text-overflow:ellipsis;opacity:.8}
  .tl-tool em{flex:none;font-style:normal;color:var(--idle)}
  .tl-tool.err b{color:var(--danger)}
  /* A folded run of calls. Same line as one call, plus a caret that turns. */
  .tl-tools{display:flex;gap:8px;min-width:0;white-space:nowrap;cursor:pointer;
    font-family:var(--mono);font-size:12px;line-height:1.8;color:var(--muted)}
  .tl-tools i{flex:none;font-style:normal;color:var(--idle);
    transition:transform .12s ease-out;transform-origin:45% 55%}
  .tl-tools[aria-expanded="true"] i{transform:rotate(90deg)}
  .tl-tools b{flex:none;font-weight:500;color:#a8c3c5}
  .tl-tools span{overflow:hidden;text-overflow:ellipsis;opacity:.8}
  .tl-tools em{flex:none;font-style:normal;color:var(--idle)}
  .tl-tools.err b{color:var(--danger)}
  .tl-tools:focus-visible{outline:1px solid var(--line-12);outline-offset:2px;border-radius:3px}
  /* Still going: the line breathes rather than blinks, so a working agent is
     visible from the corner of the eye without pulling it there. */
  .tl-tool.live span,.tl-tools.live span{animation:tl-breathe 1.5s ease-in-out infinite}
  @keyframes tl-breathe{0%,100%{opacity:.34}50%{opacity:.95}}
  @media (prefers-reduced-motion:reduce){
    .tl-tool.live span,.tl-tools.live span{animation:none;opacity:.8}}
  /* Open: the calls sit under their own line, hung off a rule so a long run
     still reads as one thing. */
  .tl-tools-body{margin-left:3px;padding-left:14px;border-left:1px solid var(--line-12)}
  .tl-asst{margin:10px 0 8px;font-family:var(--sans);
    font-size:14px;line-height:1.7;color:var(--text);word-break:break-word}
  .tl-notice{margin:4px 0;font-family:var(--sans);font-size:12px;color:var(--muted)}
  /* Narration while the agent works: the same column as its replies, a step
     quieter, so what it said still reads first. */
  .tl-thinking{margin:8px 0 6px;font-family:var(--sans);
    font-size:13px;line-height:1.65;color:var(--muted);word-break:break-word}
  .tl-thinking strong{color:inherit}
  /* A past decision point. The one still open is answered in the reply bar;
     amber is kept for that. */
  .tl-decision{margin:6px 0;font-family:var(--sans);font-size:12px;
    line-height:1.6;color:var(--muted)}
  /* Timeline mode answers where you type: the open decision of the pane on
     screen sits above the composer instead of floating over the page. */
  .reply-bar{flex:none;border-top:1px solid var(--line-12);max-height:40vh;overflow-y:auto;
    padding:10px max(16px, calc((100% - 760px) / 2)) 0;font-family:var(--sans)}
  .reply-bar[hidden]{display:none}
  /* Choices and the input are one place to answer from, not two panels. */
  .reply-bar:not([hidden]) ~ .msg-composer{border-top:0}
  .rb-head{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;font-size:12px;color:var(--attention)}
  .rb-head span{flex:1;min-width:0}
  .rb-head.danger{color:var(--danger)}
  .rb-skip{flex:none;background:none;border:0;padding:0;cursor:pointer;
    font-family:var(--sans);font-size:12px;color:var(--muted)}
  .rb-skip:hover{color:var(--text)}
  .rb-opts{display:flex;flex-wrap:wrap;gap:6px}
  .rb-opts button{max-width:100%;background:none;border:1px solid var(--line-20);border-radius:16px;
    padding:6px 12px;cursor:pointer;text-align:left;font-family:var(--sans);font-size:13px;
    line-height:1.4;color:var(--text)}
  .rb-opts button:first-child{border-color:var(--accent-20);color:var(--accent)}
  .rb-opts button:hover{border-color:var(--accent)}
  .md p{margin:0 0 .65em}
  .md>:last-child{margin-bottom:0}
  .md strong{font-weight:600;color:#e6f2f2}
  .md a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-20);word-break:break-all}
  .md code{font-family:var(--mono);font-size:.86em;padding:.1em .35em;border-radius:3px;
    background:rgba(150,215,225,.08)}
  .md pre{margin:.3em 0 .8em;padding:10px 12px;border-radius:6px;overflow:auto;
    background:rgba(0,0,0,.2);font-family:var(--mono);font-size:12px;line-height:1.55}
  .md pre code{padding:0;background:none;font-size:inherit}
  .md ul,.md ol{margin:.2em 0 .65em;padding-left:1.25em}
  .md li{margin:.15em 0}
  .md li::marker{color:var(--idle)}
  .md li>ul,.md li>ol{margin:.15em 0 .2em}
  .md h3,.md h4{margin:.9em 0 .35em;font-size:14px;font-weight:600;color:#e6f2f2}
  .md blockquote{margin:0 0 .65em;padding-left:1em;color:var(--muted)}
  .md hr{margin:1em 0;border:0;height:1px;background:var(--line-12)}
  .md-table{overflow-x:auto;margin:.3em 0 .8em}
  .md table{border-collapse:collapse;font-size:13px}
  .md th,.md td{padding:5px 14px 5px 0;border-bottom:1px solid var(--line-12);text-align:left;vertical-align:top}
  .md th{font-weight:500;color:var(--muted)}
  /* Lines up with the transcript column on a wide window. */
  .msg-composer{display:none;border-top:1px solid var(--line-12);
    padding:10px max(16px, calc((100% - 760px) / 2))}
  .msg-composer.on{display:block}
  /* The border belongs to the field, not the textarea: Send sits inside it, so
     the two read as one control. Bottom-aligned so the button stays on the last
     line while the text grows upward past it. */
  .mc-field{display:flex;align-items:flex-end;gap:6px;
    border:1px solid var(--line-12);border-radius:21px;
    background:rgba(150,215,225,.04);padding:5px 5px 5px 14px}
  .mc-field:focus-within{border-color:var(--accent-20)}
  /* Who reads what you type. Agent: the accent, prose. Terminal: a square-ish
     monospace field with a $ prompt and an amber edge, so a command line never
     passes for a chat box at a glance. */
  .mc-kind{font-size:10px;letter-spacing:.04em;color:var(--accent);opacity:.8;
    margin:0 0 5px 14px}
  .mc-prompt{display:none}
  .msg-composer[data-kind="shell"] .mc-kind{color:var(--shell);font-family:var(--mono)}
  .msg-composer[data-kind="shell"] .mc-field{border-radius:8px;border-color:var(--shell-38);
    background:rgba(0,0,0,.22);padding-left:10px}
  .msg-composer[data-kind="shell"] .mc-field:focus-within{border-color:var(--shell)}
  .msg-composer[data-kind="shell"] .mc-prompt{display:block;flex:none;align-self:flex-start;
    font-family:var(--mono);font-size:13px;line-height:30px;color:var(--shell);user-select:none}
  .msg-composer[data-kind="shell"] .mc-field textarea{font-family:var(--mono);font-size:13px}
  /* Only at rest: a running or waiting pane keeps the status colour below. */
  .msg-composer[data-kind="shell"] .mc-field button:not(:disabled):not([data-status="running"]):not([data-status="waiting"]){background:var(--shell)}
  /* One row leaves the field 42px tall: 20px of line + 10px inside the textarea
     + 10px of field padding + 2px of border. That inner 30px is the button's
     size too, so an empty composer is a pill at the 21px radius above. The cap
     is eight rows (170px), past which the text scrolls instead of eating the pane. */
  .mc-field textarea{flex:1;min-width:0;border:0;background:none;color:var(--text);
    padding:5px 0;font-family:var(--sans);font-size:14px;line-height:20px;outline:none;
    height:30px;max-height:170px;resize:none;overflow-y:auto}
  .mc-field button{position:relative;flex:none;width:30px;height:30px;padding:0;border:0;
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:#041018;cursor:pointer;transition:background .12s}
  .mc-field button svg{width:17px;height:17px;fill:none;stroke:currentColor;
    stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  /* Nothing to send: still there, visibly inert, rather than gone — the field
     must not resize under the thumb between one character and none. */
  .mc-field button:disabled{background:var(--line-20);color:var(--muted);cursor:default}
  /* One glyph at a time; `data-action` says which (composer-action.js). */
  .mc-field button .ic-stop{width:13px;height:13px}
  .mc-field button .ic-stop rect{fill:currentColor;stroke:none}
  .mc-field button .ic-stop,
  .mc-field button[data-action="stop"] .ic-send{display:none}
  .mc-field button[data-action="stop"] .ic-stop{display:block}
  /* The status the removed run line used to spell out, worn by the button. It
     shows even when the button's job is Send, so an agent still reads as busy
     while you type at it. */
  .mc-field button[data-status="running"]{background:var(--running)}
  .mc-field button[data-status="waiting"]{background:var(--attention)}
  .mc-field button:disabled[data-status="running"],
  .mc-field button:disabled[data-status="waiting"]{background:var(--line-20)}
  /* Running: a ring turning just inside the button's edge. */
  .mc-field button[data-status="running"]:not(:disabled)::after{content:'';position:absolute;
    inset:2px;border-radius:50%;border:1.5px solid rgba(4,16,24,.55);
    border-right-color:transparent;animation:fmspin .9s linear infinite}
  .seg{display:inline-flex;flex:none;gap:2px;padding:2px;border:1px solid var(--line-12);border-radius:6px}
  .seg button{background:none;border:0;border-radius:4px;padding:3px 9px;cursor:pointer;
    font-family:var(--mono);font-size:11px;color:var(--muted)}
  .seg button.on{background:var(--accent-12);color:var(--accent)}
  /* ── log ────────────────────────────────────────────────── */
  #log{font-family:var(--mono);font-size:11px;line-height:1.45}
  .logline{padding:3px 0;border-bottom:1px solid var(--line-12)}
  .ll-head{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
  .ll-head:hover{opacity:1;color:var(--text)}
  .ll-head::before{content:'▸ ';color:var(--muted)}
  .logline.open .ll-head::before{content:'▾ '}
  .logline.open .ll-head{color:var(--text);opacity:1}
  .ll-body{white-space:pre-wrap;word-break:break-all;margin:3px 0 2px 12px;color:var(--muted)}
  .rx{color:var(--waiting)} .tx{color:var(--attention)} .sys{color:var(--muted)}
  .muted{color:var(--muted);font-size:12px;font-style:normal}
  .toolbar{display:flex;gap:6px;margin-bottom:8px}
  .toolbar button{font-family:var(--mono);font-size:10px;padding:3px 8px;background:var(--panel);
    border:1px solid var(--line-20);color:var(--muted);border-radius:var(--r);cursor:pointer;letter-spacing:.04em}
  .toolbar button:hover{color:var(--text);border-color:var(--line-38)}
  #detailHead{color:var(--muted);letter-spacing:.04em}
  /* iOS Safari magnifies the page whenever the field it focuses is set below
     16px, and never undoes it — so every tap on the composer left the page
     zoomed in and the reader pinching their way back out. 16px is the whole
     fix. Scoped to soft-keyboard devices so the desktop keeps its compact type;
     `maximum-scale=1` in the viewport tag would also stop it, by taking
     pinch-zoom away from the people who need it. Last in the sheet, and naming
     each field, because a media query buys no specificity over the rules above. */
  @media (pointer: coarse){
    /* 22px of line keeps 16px readable, so a row is 44px and the pill radius
       follows it. Eight rows is still the cap. */
    .mc-field{border-radius:22px}
    .mc-field textarea{font-size:16px;line-height:22px;height:32px;max-height:186px}
    .gate-input, header input{font-size:16px}
  }
</style>
</head>

<script>
// ── state ─────────────────────────────────────────────────────────────────
const GEOM_KEY = 'seahelm_pane_geometry';
function loadGeom(){
  try { return new Map(Object.entries(JSON.parse(localStorage.getItem(GEOM_KEY) || '{}'))); }
  catch (e) { return new Map(); }
}
function saveGeom(){
  try { localStorage.setItem(GEOM_KEY, JSON.stringify(Object.fromEntries(S.geom))); }
  catch (e) {}   // private mode, quota — the cache is an optimisation, not state
}

// Scrollback is charged per terminal, and mirroring a split builds one terminal
// per leaf — so the cost scales with leaf count while the value of deep history
// does not. Measured at ~122 columns: 7.6 MB per terminal at 5000, 1.5 MB at
// 1000. A six-way mirror is therefore ~45 MB of buffer nobody scrolls, on a
// phone, while you are glancing across panes rather than reading any one of
// them. Drilling into a pane switches to single mode, which gets the full depth.
//
// Depth is not a speed knob: paint moves 4% between 1000 and 5000. This buys
// memory on multi-pane mirrors and nothing else.
// Matches the Mac's own flush window in spirit, not in number: this one only
// applies to a burst, never to the keystroke that starts it.
const VT_INPUT_WINDOW_MS = 10;
const VT_SCROLLBACK_DEEP = 5000;
const VT_SCROLLBACK_SHALLOW = 1000;
const VT_SHALLOW_FROM_LEAVES = 3;

function scrollbackForLeafCount(count){
  return count >= VT_SHALLOW_FROM_LEAVES ? VT_SCROLLBACK_SHALLOW : VT_SCROLLBACK_DEEP;
}

const S = {
  mac:'testmac', transport:null,   // transport: null | 'gateway'
  gw:null,   // gateway WebSocket state
  panes:new Map(), worktrees:new Map(),
  focus:null, dnd:null, events:new Map(),
  // Tool runs the reader has opened, by the run's first `seq` (tool-group.js).
  toolOpen:new Set(),
  // `sel` is the selected worktree path; `selPane` the pane whose terminal is shown.
  sel:null, selPane:null,
  authPass:null, pendingCode:null,   // authPass = long-lived token; pendingCode for first pair
  // VT terminal: `open` is the pane key currently streaming
  // One entry per mirrored pane, keyed by paneSessionKey; `focus` is the pane
  // keystrokes reach, `worktree` is the layout currently mounted.
  vt:{ panes:new Map(), focus:null, worktree:null, tree:null, mode:'mirror',
       scrollback:VT_SCROLLBACK_DEEP },
  // MessageStream timeline (text mode). Keyed by pane_session_key.
  messages:{},
  // Paging older timeline pages in, per pane: {loading, done}.
  history:{},
  // 'text' | 'vt' — phone/narrow defaults to text so VT is opt-in.
  surfaceMode: null,
  // paneSessionKey → {cols, rows}, learned from vt.snapshot and remembered so
  // the next mount can decide its layout without attaching first. Persisted
  // because that decision happens *before* anything attaches: on a cold visit
  // the prior is a guess, and a wrong guess in the conservative direction would
  // otherwise stick until the window happened to be resized.
  geom:loadGeom(),
  // Groups are computed Mac-side (fleet.groups) so the browser cannot drift
  // from the dashboard; `groups` is null until the first reply lands.
  grouping:{ mode: localStorage.getItem('seahelm_grouping') || 'repository', groups:null },
  // worktree path → {running_since, last_activity_at}, from `fleet.groups`: what
  // the time on the right of each fleet row counts from.
  rowTimes:new Map(),
};
// Opening size only. zmx reports no geometry and has no resize verb, so the
// bridge reads the session's real grid from outside (pid → tty → `stty size`)
// and ships it with the snapshot; we resize to that before replaying. These
// numbers just give the terminal a sane box for the moment before it lands.
// Sizing stays one-way — we mirror the Mac's split tree and scale each pane's
// font to its slot (fitPaneFont); we cannot reshape a Mac-side pane.
const VT_COLS = 120, VT_ROWS = 32;
// The size a pane renders at when its grid fits. fitPaneFont only ever scales
// DOWN from here: mirroring the Mac's layout already gives each slot roughly the
// shape of the grid inside it, so the base size is the intended size rather than
// a floor to grow off. VT_FONT_MIN is where shrinking stops being worth it —
// below this you cannot read the pane anyway, so we pan instead.
const VT_FONT_BASE = 12, VT_FONT_MIN = 9;

// SailorStatus.color, 1:1 with Sources/Core/SailorStatus.swift (dark values).
// `waiting` is the amber attention accent, NOT the blue one — the Mac routes
// waiting through SemanticColors.attention, and exited shares idle's grey.
const STC = {
  running:'#1bb062', waiting:'#e0a458', done:'#557170',
  failed:'#e84635', idle:'#557170', unknown:'#7fa0a3',
};
// SailorStatus.glyph. `running` is drawn as a spinning arc instead (SpinnerDotView).
const STG = {
  running:'◐', waiting:'●', done:'◌', failed:'✕', idle:'○', unknown:'◌',
};
// DeckColor — same 10-swatch djb2 hash as Sources/UI/Dashboard/DeckColor.swift
const DECK = [0xd97757,0x10a37f,0x8b7fd9,0x4285f4,0x6aa84f,
              0xb07ad9,0xe0a030,0x4aa3a3,0xd96f9a,0x7a9bd9];
function deckColor(name){
  let h = 5381n;
  for (const b of new TextEncoder().encode(String(name||''))) {
    h = (h * 33n + BigInt(b)) & 0xffffffffffffffffn;
  }
  const hex = DECK[Number(h % 10n)].toString(16).padStart(6,'0');
  return '#' + hex;
}
// SailorStatus rawValue is capitalized (Running/Waiting/Error/Exited/Idle);
// mock uses lowercase (running/waiting/failed/done). Normalize both → STC keys.
function normStatus(s){
  switch(String(s||'').toLowerCase()){
    case 'running': return 'running';
    case 'waiting': return 'waiting';
    case 'error':
    case 'failed':  return 'failed';
    case 'exited':
    case 'done':    return 'done';
    case 'idle':    return 'idle';
    default:        return 'unknown';
  }
}
const stColor = s => STC[normStatus(s)] || STC.unknown;
// pane_id is a UUID (station id); show a short, stable prefix.
const shortId = id => String(id||'').split('-')[0].slice(0,8) || '—';
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const base = () => `seahelm/${S.mac}`;

// Same-origin Host Gateway WSS. Prefer this whenever the page is served by
// Host Gateway (any host/port), so plain HTTP Tailscale URLs work.
function gatewayWsURL(){
  const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${scheme}//${location.host}/ws`;
}
function isLinked(){
  if (S.transport === 'gateway') return !!(S.gw && S.gw.ready && S.gw.ws && S.gw.ws.readyState === WebSocket.OPEN);
  return false;
}
function disconnectAll(){
  if (S.gw && S.gw.ws) { S.gw.ws.close(); S.gw = null; }
  S.transport = null;
}

// ── logging ───────────────────────────────────────────────────────────────
// VT frames arrive per keystroke and per screen update, so leaving them in
// drowns everything worth reading — the log was a wall of `RX vt.data`. Filtered
// by default, with a switch for when the terminal stream is the thing you are
// debugging.
const VT_METHODS = new Set(['vt.data', 'vt.snapshot', 'pane.send_keys', 'pane.vt_keepalive']);
let showVTFrames = localStorage.getItem('seahelm_log_vt') === '1';

function setShowVTFrames(on){
  showVTFrames = on;
  localStorage.setItem('seahelm_log_vt', on ? '1' : '0');
  const btn = $('logVtBtn');
  if (btn){ btn.classList.toggle('on', on); btn.title = on ? 'Hide VT frames' : 'Show VT frames'; }
}

function log(dir, topic, payload){
  if (!showVTFrames && VT_METHODS.has(String(topic))) return;
  const el = document.createElement('div');
  el.className = 'logline ' + dir;
  const body = typeof payload === 'string' ? payload : JSON.stringify(payload);
  const ts = new Date().toLocaleTimeString('en-GB');   // HH:MM:SS
  const head = document.createElement('div');
  head.className = 'll-head';
  head.textContent = `${ts} ${dir.toUpperCase()} ${topic}`;   // collapsed one-liner
  const bd = document.createElement('div');
  bd.className = 'll-body'; bd.textContent = body; bd.hidden = true;
  head.onclick = () => { bd.hidden = !bd.hidden; el.classList.toggle('open', !bd.hidden); };
  el.appendChild(head); el.appendChild(bd);
  $('log').prepend(el);   // newest on top (reverse-chronological)
}
function setStatus(on, txt){
  const s = $('status'); s.textContent = txt; s.className = on ? 'st-on' : 'st-off';
  // The gate is a function of connection state, so it re-renders wherever that
  // state is set — including the paths that drop the socket without asking.
  renderGate();
  renderSendButton();
}

// ── connect ───────────────────────────────────────────────────────────────
// Remembered across a drop so the page can put itself back: which worktree was
// mounted, and which pane had focus. The panes themselves are torn down — their
// attach leases died with the socket — and rebuilt on the way back.
let lastMount = null;
// Whether this page has been linked at least once. A drop after that is a blip
// the reconnector is already fixing, so the gate stays out of the way; before
// it, there is nothing on the page to keep showing.
let hadLink = false;
// Auto-retries a drop gets with the gate kept down. The first ones come back in
// well under a few seconds; past this the Mac is plausibly gone and the user
// should see it, with a way to retry now.
const QUIET_RETRIES = 3;

const reconnector = SeahelmReconnect.createReconnector({
  attempt: () => openGatewaySocket(),
  onSchedule: ({ retrying, attempt, delayMs }) => {
    if (retrying) setStatus(false, `\u91cd\u8fde\u4e2d\u2026 (${attempt})`);
  },
});

function connect(){
  disconnectAll();
  S.mac = $('mac').value.trim() || S.mac || 'testmac';
  reconnector.resume();
  openGatewaySocket();
}

function openGatewaySocket(){
  const url = gatewayWsURL();
  if (!S.authPass && !S.pendingCode) {
    reconnector.stop();            // nothing to authenticate with
    setStatus(false, 'Pairing code needed');
    return;
  }
  const wsURL = url;
  S.transport = 'gateway';
  log('sys', '(connect)', wsURL + ' [Gateway]');
  const ws = new WebSocket(wsURL);
  ws.binaryType = 'arraybuffer';
  S.gw = { ws, ready: false, req: new Map(), n: 0, binary: false, deflate: false, keysBinary: false };
  ws.onopen = () => {
    // The gateway replays every ring after auth. Start empty so that replay is
    // the whole history — and because a restarted Mac numbers `seq` from 1.
    S.messages = {};
    S.history = {};
    const params = {
      vt_binary: true,
      vt_deflate: VTFrame.deflateSupported(),
      keys_binary: true,
    };
    if (S.pendingCode) params.code = S.pendingCode;
    else { params.mac_id = S.mac; params.token = S.authPass; }
    gwSend('auth', params, (r, err) => {
      // Capture before clearing: token vs code decides whether we drop the
      // remembered pair and put the gate back on the code form.
      const usedCode = !!S.pendingCode;
      if (err && err.code === -32029) {
        S.pendingCode = null;
        reconnector.stop();        // retrying would only burn the rate limit
        rejectAuth({ usedCode, rateLimited: true, detail: err });
        ws.close();
        return;
      }
      if (err || !r || r.ok === false) {
        S.pendingCode = null;
        reconnector.stop();        // a rejected credential stays rejected
        rejectAuth({ usedCode, rateLimited: false, detail: err || r });
        ws.close();
        return;
      }
      gateErrorMsg = null;
      S.gw.ready = true;
      S.gw.binary = !!(r && r.vt_binary);
      S.gw.deflate = !!(r && r.vt_deflate);
      S.gw.keysBinary = !!(r && r.keys_binary);
      if (r.mac_id) S.mac = r.mac_id;
      if (r.token) S.authPass = r.token;
      S.pendingCode = null;
      try {
        localStorage.setItem(CREDS_KEY, JSON.stringify({ m: S.mac, t: S.authPass }));
      } catch (e) {}
      if ($('mac')) $('mac').value = S.mac;
      log('sys', '(vt format)', S.gw.binary ? (S.gw.deflate ? 'binary+deflate' : 'binary') : 'json+base64');
      hadLink = true;
      reconnector.succeeded();
      setStatus(true, 'Connected');
      // The Mac folds the snapshot into the auth reply, because a round trip
      // over the tunnel costs far more than the query does. Ask separately only
      // when talking to one that predates it.
      if (r.panes) {
        applySessionSnapshot(r);
        restoreMount();
      } else {
        gwSend('session.snapshot', {}, (snap) => {
          if (snap && snap.panes) applySessionSnapshot(snap);
          restoreMount();
        });
      }
    });
  };
  ws.onmessage = (ev) => {
    if (ev.data instanceof ArrayBuffer) { onGatewayBinaryFrame(new Uint8Array(ev.data)); return; }
    try { onGatewayFrame(JSON.parse(ev.data)); } catch {}
  };
  ws.onclose = () => {
    S.gw = null; S.transport = null;
    // The panes' attach leases went with the socket; keep where we were so
    // the reconnect can put it back rather than landing on an empty page.
    if (S.vt.worktree) lastMount = { path: S.vt.worktree, focus: S.vt.focus };
    unmountPanes();
    // Do not overwrite a gate-visible auth error with a generic "offline".
    if (reconnector.isStopped && !gateErrorMsg) setStatus(false, 'Offline');
    reconnector.closed();
  };
  ws.onerror = () => { if (reconnector.isStopped) setStatus(false, 'Error'); };
}

/** Put back the worktree that was on screen before the drop. */
function restoreMount(){
  if (!lastMount) return;
  const { path, focus } = lastMount;
  lastMount = null;
  // Addressed by path, because the row objects are rebuilt from the fresh
  // snapshot — the ones we held before the drop are stale.
  const row = buildFleet().find(r => r.path === path);
  if (row) selectWorktree(row, focus);
}

function gwSend(method, params, onReply){
  if (!S.gw || !S.gw.ws || S.gw.ws.readyState !== WebSocket.OPEN) return;
  const id = 'g' + (++S.gw.n);
  const frame = { id, method, params };
  if (onReply) S.gw.req.set(id, onReply);
  S.gw.ws.send(JSON.stringify(frame));
  log('tx', method, frame);
}

// ── binary VT frames ──────────────────────────────────────────────────────
// The wire format itself lives in vt-frame.js, shared with bench.html so the
// benchmark cannot drift onto a format the socket no longer speaks.

// Inflation is async, and a terminal that applies two chunks out of order is
// corrupted — not slow, corrupted. Every frame for a pane is therefore threaded
// through one promise chain, so decode can overlap but application cannot.
// Under decode backlog, drop intermediate vt.data rather than growing forever.
// Snapshots always enqueue (they reset the terminal).
const VT_APPLY_MAX = 8;
const vtApply = SeahelmVTApply.createApplyQueue({
  maxData: VT_APPLY_MAX,
  onDrop: (key) => log('sys', '(vt drop)', key),
  onError: (_key, e) => log('sys', '(vt)', `frame dropped: ${e && e.message}`),
});
function enqueueVTApply(key, type, work){ return vtApply.enqueue(key, type, work); }
/// A pane that goes away takes its chain with it — the map is keyed by pane and
/// nothing else ever removed an entry, so worktree churn grew it for the life of
/// the page.
function releaseVTChain(key){ vtApply.release(key); }

function onGatewayBinaryFrame(buf){
  // The auth reply is what makes these frames expected at all. Checking it here
  // turns a server that ignored the negotiation into one visible log line
  // instead of a terminal that renders some frames and silently drops the rest.
  if (!S.gw || !S.gw.binary) {
    log('sys', '(vt)', `binary frame on a JSON-negotiated socket, dropped (${buf.length}B)`);
    return;
  }
  const f = VTFrame.parse(buf);
  if (!f) { log('sys', '(vt)', `unparseable binary frame, ${buf.length}B`); return; }
  if (f.deflated && !S.gw.deflate) {
    log('sys', '(vt)', 'deflated frame we did not negotiate for, dropped');
    return;
  }
  log('rx', f.type, `${f.type} ${f.body.length}B${f.deflated ? ' deflated' : ''} (payload elided)`);

  enqueueVTApply(f.key, f.type, async () => {
    const bytes = f.deflated ? await VTFrame.inflateRaw(f.body) : f.body;
    await handleVT(f.key, { type: f.type, bytes, cols: f.cols, rows: f.rows });
  });
}

function onGatewayFrame(msg){
  if (msg.type === 'notify') {
    const p = msg.params || {};
    // Size from the base64 length, not by decoding it: log() discards VT frames
    // by default, but arguments are evaluated first, so this line used to decode
    // every single payload a second time and throw the result away.
    const elide = p.b64 ? `${msg.method} ${b64Size(p.b64)}B (payload elided)` : msg.params;
    log('rx', msg.method, elide);
    onGatewayNotify(msg.method, p);
    return;
  }
  const cb = msg.id && S.gw && S.gw.req.get(msg.id);
  if (cb) {
    S.gw.req.delete(msg.id);
    log('rx', msg.id, msg.error || msg.result);
    cb(msg.result, msg.error || null);
    return;
  }
  log('rx', '(frame)', msg);
}

function onGatewayNotify(method, params){
  // Open questions / suggestions — pushed by the Mac and replayed on auth.
  if (method === 'pane.event') {
    const key = params.pane_session_key || params.pane_id;
    if (!key) return;
    if (params.cleared) S.events.delete(key);
    else S.events.set(key, params);
    renderSuggestions();
    return;
  }
  if (method === 'pane.message') {
    onPaneMessage(params);
    return;
  }
  if (method === 'pane.status') {
    onPaneStatus(params);
    return;
  }
  if (method === 'pane.closed') {
    onPaneClosed(params);
    return;
  }
  if (method === 'vt.snapshot' || method === 'vt.data') {
    const key = params.pane_session_key || params.pane_id;
    const type = method === 'vt.snapshot' ? 'vt.snapshot' : 'vt.data';
    enqueueVTApply(key, type, async () => {
      await handleVT(key, {
        type, b64: params.b64, cols: params.cols, rows: params.rows,
      });
    });
  }
}

// ── fleet updates ──────────────────────────────────────────────────────────
// The pane list arrives once, with authentication. These keep it current: the
// Mac pushes status changes and closed panes, and anything about a pane this
// page has never seen means the fleet itself changed, so it is asked for again.

/** A pane changed status on the Mac: patch the row the list already has. */
function onPaneStatus(p){
  const key = p.pane_session_key || p.pane_id;
  if (!key) return;
  const pane = S.panes.get(key);
  if (!pane) { refreshFleetSoon(true); return; }
  if (p.status) pane.status = p.status;
  if (p.agent_type) pane.agent_type = p.agent_type;
  if (typeof p.last_message === 'string') pane.last_message = p.last_message;
  refreshFleetSoon(false);
  if (key === S.selPane) renderSendButton();
}

function onPaneClosed(p){
  const key = p.pane_session_key || p.pane_id;
  if (!key || !S.panes.has(key)) return;
  S.panes.delete(key);
  S.events.delete(key);
  delete S.messages[key];
  delete S.history[key];
  if (S.selPane === key) {
    // Stay on the worktree if it still has panes; otherwise there is nothing to show.
    S.selPane = null;
    if (!buildFleet().some(r => r.path === S.sel)) S.sel = null;
    S.vt.worktree = null;              // remount rather than keep a dead pane on screen
    renderDetail();
  }
  refreshFleetSoon(false);
}

let treeFrame = 0;
let fleetTimer = null;
let fleetNeedsSnapshot = false;
/** Repaint the list on the next frame; re-ask the Mac for its grouping — and the
 *  pane list, when one appeared — at most once a second while changes keep coming. */
function refreshFleetSoon(needSnapshot){
  if (!treeFrame) treeFrame = requestAnimationFrame(() => { treeFrame = 0; renderTree(); });
  fleetNeedsSnapshot = fleetNeedsSnapshot || needSnapshot;
  if (fleetTimer) return;
  fleetTimer = setTimeout(() => {
    fleetTimer = null;
    if (!isLinked()) return;
    const withPanes = fleetNeedsSnapshot;
    fleetNeedsSnapshot = false;
    if (withPanes) {
      gwSend('session.snapshot', {}, (snap) => { if (snap && snap.panes) applySessionSnapshot(snap); });
    } else {
      refreshGroups();
    }
  }, 1000);
}

function onPaneMessage(params){
  const key = params.pane_session_key || params.pane_id;
  if (!key) return;
  const list = (S.messages[key] = S.messages[key] || []);
  if (!SeahelmMessageTimeline.appendMessage(list, params, MESSAGE_CAP)) return;
  // Only the selected pane: the composer sends to `S.selPane`, so the timeline
  // on screen must be that pane's and nobody else's.
  if (loadSurfaceMode() === 'text' && S.selPane === key) {
    renderMessageTimeline(key);
  }
}

// As many as the Mac keeps on disk per pane, so paging back never evicts what
// it just loaded.
const MESSAGE_CAP = 2000;
// How close to the end still counts as being at it. A phone never lands on a
// whole pixel — device-pixel rounding and rubber-band both leave a few over —
// and a reader who stopped a line short of the end meant to be at the end.
const TL_BOTTOM_SLOP = 48;

/** Events never change once sent, so each row is built — and its markdown
 *  parsed — once, not on every repaint of a long history. */
function renderMessageRow(m){
  if (m._html == null) {
    const body = messageRowHTML(m);
    // `data-seq` is how the scroll keeper finds this row again after the list
    // is rebuilt — every branch below opens with a single `<div`.
    m._html = body ? body.replace(/^<div/, `<div data-seq="${Number(m.seq)}"`) : '';
  }
  return m._html;
}

/** A folded run of calls: one line, click to open. Unlike a row this is not
 *  cached — whether it is the one still running depends on what has arrived
 *  since, not on the calls themselves. */
function renderToolGroup(g, live){
  const open = S.toolOpen.has(g.key);
  const cls = `tl-tools${g.isError ? ' err' : ''}${live && !open ? ' live' : ''}`;
  // `data-seq` only while closed: open, the calls carry their own, and the
  // scroll keeper reads the list top to bottom (timeline-scroll.js).
  const head = `<div class="${cls}" role="button" tabindex="0" aria-expanded="${open}"`
    + ` data-tools="${g.key}"${open ? '' : ` data-seq="${g.seq}"`}>`
    + `<i>\u203a</i><b>${esc(g.tool)}</b><span>${esc(g.detail)}</span><em>\u00d7${g.count}</em></div>`;
  return open
    ? `<div>${head}<div class="tl-tools-body">${g.rows.map(renderMessageRow).join('')}</div></div>`
    : head;
}

function messageRowHTML(m){
  switch (m.kind) {
    case 'tool': {
      const count = m.count > 1 ? `<em>×${m.count}</em>` : '';
      // Tools without arguments (AskUserQuestion) report their own name as detail.
      const detail = m.detail && m.detail !== m.tool ? m.detail : '';
      return `<div class="tl-tool${m.is_error ? ' err' : ''}"><b>${esc(m.tool || '')}</b>`
        + `<span>${esc(detail)}</span>${count}</div>`;
    }
    case 'user':
      return `<div class="tl-user"><div>${esc(m.text || '')}</div></div>`;
    case 'assistant':
      return `<div class="tl-asst md">${SeahelmMarkdown.render(m.text || '')}</div>`;
    case 'status': {
      // A static dot: the spinner the fleet list uses would claim a past
      // "running" is still going.
      const st = normStatus(m.status);
      return `<div class="tl-status"><i style="background:${STC[st] || STC.unknown}"></i>${esc(m.status || '')}</div>`;
    }
    case 'decision':
      return `<div class="tl-decision">${esc(m.text || '')}</div>`;
    case 'notice':
      return `<div class="tl-notice">${esc(m.text || '')}</div>`;
    case 'thinking':
      return `<div class="tl-thinking md">${SeahelmMarkdown.render(m.text || '')}</div>`;
    default:
      return '';
  }
}

function renderMessageTimeline(key){
  const host = $('messageTimeline');
  if (!host) return;
  renderSendButton();
  // Text mode hides #termWrap, and with it the "Select a worktree" hint the
  // terminal path shows — so without this a phone opens on an empty page.
  if (!key) {
    const hint = getComputedStyle($('drawerBtn')).display === 'none'
      ? 'Pick a pane from the list on the left' : 'Tap ☰ at the top left to pick a pane';
    host.innerHTML = `<div class="tl"><div class="tl-empty">${hint}</div></div>`;
    host.dataset.key = '';
    renderTimelineToBottom();
    return;
  }
  const rows = S.messages[key] || [];
  const items = SeahelmToolGroup.fold(rows);
  // Only the newest run can be the one still being run, and only while the pane
  // is actually working — a finished turn's last run must not keep breathing.
  const live = normStatus((S.panes.get(key) || {}).status) === 'running';
  // Follow new output only while already at the bottom; someone scrolled up to
  // read holds their row instead (timeline-scroll.js). A different pane always
  // opens at its latest.
  const anchor = host.dataset.key !== key
    ? { follow: true }
    : SeahelmTimelineScroll.capture(host, timelineRowIndex(host), TL_BOTTOM_SLOP);
  const h = S.history[key] || {};
  const top = h.loading ? '<div class="tl-more">Loading earlier messages…</div>'
    : h.done ? '<div class="tl-more">No earlier messages</div>' : '';
  host.innerHTML = rows.length
    ? `<div class="tl">${top}${items.map((it, i) => {
        // Only the newest line can be the one being run, and only while the
        // pane is working — a finished turn's last call must not keep breathing.
        const now = live && i === items.length - 1;
        if (it.kind === 'tools') return renderToolGroup(it, now);
        const row = renderMessageRow(it.msg);
        // A call still on its own breathes the same way a folded run does: the
        // moment you most want it to is before a second call has arrived.
        return now && it.msg.kind === 'tool' ? row.replace('class="tl-tool', 'class="tl-tool live') : row;
      }).join('')}</div>`
    : '<div class="tl"><div class="tl-empty">Nothing yet — messages appear here once the agent starts working</div></div>';
  host.dataset.key = key;
  // Synchronously, before anything can paint or read the position back: the
  // innerHTML above emptied the scroller, so scrollTop is 0 until this lands.
  host.scrollTop = SeahelmTimelineScroll.restore(host, anchor, (seq) => timelineRowTop(host, seq));
  renderTimelineToBottom();
  // Near the top, or too little to scroll at all: fetch the page before.
  requestAnimationFrame(() => { if (host.scrollTop < 200) loadOlderMessages(key); });
}

/** The rendered rows, top to bottom, as timeline-scroll.js reads them. `top` is
 *  measured against the scroller's own content so it survives the composer
 *  growing or the head changing height underneath us. */
function timelineRowIndex(host){
  const nodes = host.querySelectorAll('[data-seq]');
  const base = host.getBoundingClientRect().top - host.scrollTop;
  return {
    length: nodes.length,
    seqAt: (i) => Number(nodes[i].dataset.seq),
    topAt: (i) => nodes[i].getBoundingClientRect().top - base,
  };
}

function timelineRowTop(host, seq){
  const row = host.querySelector(`[data-seq="${seq}"]`);
  if (!row) return null;
  return row.getBoundingClientRect().top - (host.getBoundingClientRect().top - host.scrollTop);
}

/** "↓ Latest" while the timeline is held above the end. The button lives in
 *  #midcol, whose bottom is the composer's — so it is parked on the timeline's
 *  own bottom edge, wherever a grown composer has pushed that to. */
function renderTimelineToBottom(){
  const btn = $('toBottom'), host = $('messageTimeline'), mid = $('midcol');
  if (!btn || !host || loadSurfaceMode() !== 'text') return;
  const held = host.scrollHeight - host.scrollTop - host.clientHeight > TL_BOTTOM_SLOP;
  btn.classList.toggle('on', held);
  if (held && mid) btn.style.bottom = (mid.clientHeight - host.offsetTop - host.offsetHeight + 12) + 'px';
}

function loadOlderMessages(key){
  const list = S.messages[key];
  if (!key || key !== S.selPane || !list || !list.length) return;
  if (loadSurfaceMode() !== 'text' || !isLinked()) return;
  const h = (S.history[key] = S.history[key] || { loading: false, done: false });
  if (h.loading || h.done) return;
  h.loading = true;
  renderMessageTimeline(key);
  sendCommand('message.history', { pane_session_key: key, before_seq: SeahelmMessageTimeline.oldestSeq(list), limit: 50 }, (r) => {
    h.loading = false;
    if (S.messages[key] !== list) return;          // the socket dropped meanwhile
    if (!r || r.ok === false) {
      // A Mac without history, or a failed read: stop asking rather than retry on every scroll.
      h.done = true;
    } else {
      const older = r.result.messages || [];
      for (const m of older) SeahelmMessageTimeline.appendMessage(list, m, MESSAGE_CAP);
      if (!r.result.has_more || !older.length) h.done = true;
    }
    if (S.selPane === key && loadSurfaceMode() === 'text') renderMessageTimeline(key);
  });
}

// Every agent seahelm knows says "esc to interrupt" in its status line, and ^C
// at an idle Claude or Codex prompt is the first half of quitting it. A shell
// is the other way round: Esc does nothing, ^C stops it.
const paneKindOf = (pane) => SeahelmComposerAction.paneKind(pane && pane.agent_type);
const interruptsWithCtrlC = (pane) => paneKindOf(pane).kind === 'shell';

const SEND_LABEL = {
  send: 'Send',
  none: 'Send',
  stop: { running: 'Stop — interrupt this turn', waiting: 'Stop — never mind, take it back' },
};


function interruptPane(){
  const key = S.selPane;
  if (!key || !isLinked()) return;
  const pane = S.panes.get(key) || {};
  const keys = interruptsWithCtrlC(pane) ? ['ctrl+c'] : ['esc'];
  sendCommand('pane.send_keys', { pane_id: pane.pane_id || key, keys }, (r) => {
    if (r && r.ok === false) {
      showActionToast((r.error && r.error.message) || 'Interrupt failed', true);
      return;
    }
    showActionToast('Interrupted');
  });
}

const SURFACE_KEY = 'seahelm_surface_mode';
function defaultSurfaceMode(){
  return (window.innerWidth || 900) <= 760 ? 'text' : 'vt';
}
function loadSurfaceMode(){
  if (S.surfaceMode === 'text' || S.surfaceMode === 'vt') return S.surfaceMode;
  const v = localStorage.getItem(SURFACE_KEY);
  if (v === 'text' || v === 'vt') { S.surfaceMode = v; return v; }
  S.surfaceMode = defaultSurfaceMode();
  return S.surfaceMode;
}
function applySurfaceMode(){
  const text = loadSurfaceMode() === 'text';
  const tl = $('messageTimeline');
  const wrap = $('termWrap');
  const toBottom = $('toBottom');
  const composer = $('msgComposer');
  const vtBadge = $('vtModeBadge');
  const rendererBadge = $('rendererBadge');
  if (tl) tl.classList.toggle('on', text);
  if (wrap) wrap.classList.toggle('text-hidden', text);
  // Both surfaces scroll back and need the way home; each drives `on` itself,
  // so switching modes only has to drop the other's answer.
  if (toBottom) {
    toBottom.classList.remove('on');
    toBottom.style.bottom = '';   // text mode parks it on the timeline's edge instead
  }
  if (composer) composer.classList.toggle('on', text);
  if (vtBadge) vtBadge.hidden = text;
  if (rendererBadge) rendererBadge.hidden = text;
  // Terminal keys and split/close only make sense against a live terminal; the
  // timeline keeps one of them, as Interrupt.
  const keys = $('termKeys');
  if (keys) keys.style.display = text ? 'none' : '';
  renderSendButton();
  // With a worktree open the head names it (renderDetail); only fall back to
  // the mode when there is nothing to name.
  const head = $('detailHead');
  if (head && !S.sel) head.textContent = text ? 'Timeline' : 'Terminal';
  if (text && !S.selPane) renderMessageTimeline(null);
}

function setSurfaceMode(mode){
  const next = mode === 'vt' ? 'vt' : 'text';
  const prev = loadSurfaceMode();
  S.surfaceMode = next;
  localStorage.setItem(SURFACE_KEY, S.surfaceMode);
  renderSurfaceBadge();
  applySurfaceMode();
  renderSuggestions();      // dock for the terminal, reply bar for the timeline
  if (next === prev) return;
  if (next === 'text') {
    if (S.vt.panes.size) unmountPanes();
    if (S.selPane) renderMessageTimeline(S.selPane);
  } else if (S.sel) {
    requestLayout(S.sel);
  }
}
function renderSurfaceBadge(){
  const el = $('surfaceBadge');
  if (!el) return;
  const mode = loadSurfaceMode();
  el.innerHTML = '';
  for (const [value, label, title] of [
    ['text', 'Timeline', 'The agent\'s replies and tool calls'],
    ['vt', 'Terminal', 'Open the live terminal screen'],
  ]) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.title = title;
    b.className = value === mode ? 'on' : '';
    b.onclick = () => setSurfaceMode(value);
    el.appendChild(b);
  }
}
renderSurfaceBadge();
applySurfaceMode();

/** Grow the composer to fit what is in it, up to the CSS cap. */
function autoGrowComposer(){
  const input = $('msgInput');
  if (!input) return;
  // A taller composer takes the height off the timeline, which on its own
  // leaves someone who was reading the newest line a line or two above it —
  // and, being no longer at the bottom, no longer following either. So whoever
  // was at the end is put back there once the field has settled.
  const host = $('messageTimeline');
  const wasAtEnd = host && host.scrollHeight - host.scrollTop - host.clientHeight <= TL_BOTTOM_SLOP;
  // Measure from nothing, or a field that just lost a line keeps the taller
  // scrollHeight it had and never shrinks back.
  input.style.height = 'auto';
  // `scrollHeight` is content + padding, but `box-sizing:border-box` counts the
  // border in `height` too. Without the difference the field lands two pixels
  // short of its own content and grows a scrollbar at one line.
  const border = input.offsetHeight - input.clientHeight;
  // No ceiling here: `max-height` in the CSS clamps it, and the field scrolls.
  input.style.height = (input.scrollHeight + border) + 'px';
  if (wasAtEnd) host.scrollTop = host.scrollHeight;
  renderTimelineToBottom();
  renderSendButton();
}

/** Dress the composer for what is on the other end: an agent reads what you
 *  write, a bare terminal runs it as a command. The two looked identical, and
 *  prose sent to a shell is a string of errors — or worse, a command. */
function renderComposerKind(pane){
  const box = $('msgComposer'), input = $('msgInput'), tag = $('mcKind');
  if (!box || !input) return;
  const k = pane ? paneKindOf(pane) : null;
  const kind = k ? k.kind : 'agent';
  if (box.dataset.kind !== kind) box.dataset.kind = kind;
  const placeholder = !k ? 'Send to this pane…'
    : kind === 'shell' ? 'Run a command in this terminal…'
    : `Message ${k.label}…`;
  if (input.placeholder !== placeholder) input.placeholder = placeholder;
  if (tag) {
    tag.textContent = k ? (kind === 'shell' ? 'Terminal · no agent' : k.label) : '';
    tag.hidden = !k;
  }
}

/** The composer's one button: what it will do, and what the pane is doing.
 *  An icon carries no label, so both have to be visible on it. */
function renderSendButton(){
  const btn = $('msgSend'), input = $('msgInput');
  if (!btn) return;
  const pane = (S.selPane && S.panes.get(S.selPane)) || null;
  const status = pane ? normStatus(pane.status) : 'idle';
  const action = SeahelmComposerAction.composerAction({
    hasText: !!(input && input.value.trim()),
    status,
    ready: !!(S.selPane && isLinked()),
  });
  btn.dataset.action = action;
  // The status is worn whether or not it is the button's job right now, so a
  // running agent still reads as running while you type at it.
  btn.dataset.status = status;
  btn.disabled = action === 'none';

  renderComposerKind(pane);
  const shell = !!pane && paneKindOf(pane).kind === 'shell';
  let label = action === 'stop' ? SEND_LABEL.stop[status]
    : (shell ? 'Run in terminal' : SEND_LABEL[action]);
  if (action === 'stop' && !interruptsWithCtrlC(pane)) {
    label += ' (Esc)';
  } else if (action === 'stop') {
    label += ' (Ctrl+C)';
  }
  // The elapsed time the status line used to show: no longer worth a row, but
  // it costs nothing here.
  const since = status === 'running' && pane
    ? (S.rowTimes.get(pane.worktree_path) || {}).running_since : 0;
  if (since) label += ` — running ${compactDuration(since)}`;
  else if (action !== 'stop' && status === 'running') label += ' — the agent is running';
  btn.title = label;
  btn.setAttribute('aria-label', label);
}

/**
 * @param {boolean} byTap  true when the send button was pressed, rather than Enter.
 *   Reaching for the button means "done typing", so on a phone the keyboard is
 *   dismissed — half the screen back, and what you just sent is what you want to
 *   look at. Enter keeps the caret: someone typing is likely still typing.
 */
function sendComposerText(byTap){
  const input = $('msgInput');
  const text = (input && input.value || '').trim();
  const key = S.selPane;
  if (!text || !key || !isLinked()) return;
  const pane = S.panes.get(key) || {};
  const paneId = pane.pane_id || key;
  sendCommand('pane.send_text', { pane_id: paneId, text, enter: true }, () => {});
  input.value = '';
  if (byTap) input.blur();
  autoGrowComposer();
  // Sending re-arms following, wherever you had scrolled back to: the reply is
  // what you are now waiting for.
  const host = $('messageTimeline');
  if (host && loadSurfaceMode() === 'text') { host.scrollTop = host.scrollHeight; renderTimelineToBottom(); }
}
(function wireComposer(){
  const send = $('msgSend');
  const input = $('msgInput');
  // One button, so the click dispatches on what it currently means.
  if (send) send.onclick = () => {
    if (send.dataset.action === 'stop') interruptPane();
    else sendComposerText(true);
  };
  if (input) input.addEventListener('input', autoGrowComposer);
  if (input) input.addEventListener('keydown', (ev) => {
    // Enter and Escape mean nothing here while an IME is composing — see
    // composer-keys.js.
    const action = SeahelmComposerKeys.composerKeyAction(ev);
    if (action === 'send') { ev.preventDefault(); sendComposerText(); }
    if (action === 'esc') {
      const key = S.selPane;
      const pane = S.panes.get(key) || {};
      const paneId = pane.pane_id || key;
      if (key && isLinked()) sendCommand('pane.send_keys', { pane_id: paneId, keys: ['esc'] });
    }
  });
})();


/** Ask the Mac to group the fleet the way its dashboard would. */
function refreshGroups(){
  if (S.transport !== 'gateway' || !isLinked()) { renderTree(); return; }
  const mode = S.grouping.mode;
  sendCommand('fleet.groups', { mode }, (r) => {
    if (S.grouping.mode !== mode) return;            // mode changed while in flight
    S.grouping.groups = (r && r.ok !== false && r.result && r.result.groups) || null;
    S.rowTimes = new Map();
    for (const g of S.grouping.groups || []) {
      for (const i of g.items || []) S.rowTimes.set(i.worktree_path, i);
    }
    renderTree();

}
function setGroupingMode(mode){
  S.grouping.mode = mode;
  localStorage.setItem('seahelm_grouping', mode);
  syncModeButtons();
  refreshGroups();
}
function syncModeButtons(){
  for (const b of document.querySelectorAll('#fmModes button'))
    b.classList.toggle('on', b.dataset.mode === S.grouping.mode);
}
for (const b of document.querySelectorAll('#fmModes button'))
  b.onclick = () => setGroupingMode(b.dataset.mode);
syncModeButtons();

function applySessionSnapshot(result){
  S.panes.clear();
  for (const p of (result.panes || [])) {
    const key = p.pane_session_key || p.pane_id;
    if (key) S.panes.set(key, p);
