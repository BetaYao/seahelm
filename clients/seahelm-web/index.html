<link rel="stylesheet" href="./xterm.css" />
<script src="./xterm.js"></script>
<script src="./xterm-addon-webgl.js"></script>
<script src="./e2ee.js"></script>
<script>
// ── state ─────────────────────────────────────────────────────────────────
const GEOM_KEY = 'seahelm_pane_geometry';
function loadGeom(){
  try { return new Map(Object.entries(JSON.parse(localStorage.getItem(GEOM_KEY) || '{}'))); }
  catch (e) { return new Map(); }
}
function saveGeom(){
  try { localStorage.setItem(GEOM_KEY, JSON.stringify(Object.fromEntries(S.geom))); }
  catch (e) {}   // private mode, quota — the cache is an optimisation, not state
}

// Scrollback is charged per terminal, and mirroring a split builds one terminal
// per leaf — so the cost scales with leaf count while the value of deep history
// does not. Measured at ~122 columns: 7.6 MB per terminal at 5000, 1.5 MB at
// 1000. A six-way mirror is therefore ~45 MB of buffer nobody scrolls, on a
// phone, while you are glancing across panes rather than reading any one of
// them. Drilling into a pane switches to single mode, which gets the full depth.
//
// Depth is not a speed knob: paint moves 4% between 1000 and 5000. This buys
// memory on multi-pane mirrors and nothing else.
const VT_SCROLLBACK_DEEP = 5000;
const VT_SCROLLBACK_SHALLOW = 1000;
const VT_SHALLOW_FROM_LEAVES = 3;

function scrollbackForLeafCount(count){
  return count >= VT_SHALLOW_FROM_LEAVES ? VT_SCROLLBACK_SHALLOW : VT_SCROLLBACK_DEEP;
}

const S = {
  client:null, mac:'testmac', transport:null,   // transport: null | 'mqtt' | 'gateway'
  gw:null,   // gateway WebSocket state when transport === 'gateway'
  panes:new Map(), worktrees:new Map(),
  focus:null, dnd:null, events:new Map(),
  // `sel` is the selected worktree path; `selPane` the pane whose terminal is shown.
  sel:null, selPane:null,
  encKey:null, authPass:null,   // set once a seahelm:// pair link is applied (E2EE on)
  // VT terminal: `open` is the pane key currently streaming
  // One entry per mirrored pane, keyed by paneSessionKey; `focus` is the pane
  // keystrokes reach, `worktree` is the layout currently mounted.
  vt:{ panes:new Map(), focus:null, worktree:null, tree:null, mode:'mirror',
       scrollback:VT_SCROLLBACK_DEEP },
  // paneSessionKey → {cols, rows}, learned from vt.snapshot and remembered so
  // the next mount can decide its layout without attaching first. Persisted
  // because that decision happens *before* anything attaches: on a cold visit
  // the prior is a guess, and a wrong guess in the conservative direction would
  // otherwise stick until the window happened to be resized.
  geom:loadGeom(),
  // Groups are computed Mac-side (fleet.groups) so the browser cannot drift
  // from the dashboard; `groups` is null until the first reply lands.
  grouping:{ mode: localStorage.getItem('seahelm_grouping') || 'repository', groups:null },
};
// Opening size only. zmx reports no geometry and has no resize verb, so the
// bridge reads the session's real grid from outside (pid → tty → `stty size`)
// and ships it with the snapshot; we resize to that before replaying. These
// numbers just give the terminal a sane box for the moment before it lands.
// Sizing stays one-way — we mirror the Mac's split tree and scale each pane's
// font to its slot (fitPaneFont); we cannot reshape a Mac-side pane.
const VT_COLS = 120, VT_ROWS = 32;
// The size a pane renders at when its grid fits. fitPaneFont only ever scales
// DOWN from here: mirroring the Mac's layout already gives each slot roughly the
// shape of the grid inside it, so the base size is the intended size rather than
// a floor to grow off. VT_FONT_MIN is where shrinking stops being worth it —
// below this you cannot read the pane anyway, so we pan instead.
const VT_FONT_BASE = 12, VT_FONT_MIN = 9;

// SailorStatus.color, 1:1 with Sources/Core/SailorStatus.swift (dark values).
// `waiting` is the amber attention accent, NOT the blue one — the Mac routes
// waiting through SemanticColors.attention, and exited shares idle's grey.
const STC = {
  running:'#1bb062', waiting:'#e0a458', done:'#557170',
  failed:'#e84635', idle:'#557170', unknown:'#7fa0a3',
};
// SailorStatus.glyph. `running` is drawn as a spinning arc instead (SpinnerDotView).
const STG = {
  running:'◐', waiting:'●', done:'◌', failed:'✕', idle:'○', unknown:'◌',
};
// DeckColor — same 10-swatch djb2 hash as Sources/UI/Dashboard/DeckColor.swift
const DECK = [0xd97757,0x10a37f,0x8b7fd9,0x4285f4,0x6aa84f,
              0xb07ad9,0xe0a030,0x4aa3a3,0xd96f9a,0x7a9bd9];
function deckColor(name){
  let h = 5381n;
  for (const b of new TextEncoder().encode(String(name||''))) {
    h = (h * 33n + BigInt(b)) & 0xffffffffffffffffn;
  }
  const hex = DECK[Number(h % 10n)].toString(16).padStart(6,'0');
  return '#' + hex;
}
// SailorStatus rawValue is capitalized (Running/Waiting/Error/Exited/Idle);
// mock uses lowercase (running/waiting/failed/done). Normalize both → STC keys.
function normStatus(s){
  switch(String(s||'').toLowerCase()){
    case 'running': return 'running';
    case 'waiting': return 'waiting';
    case 'error':
    case 'failed':  return 'failed';
    case 'exited':
    case 'done':    return 'done';
    case 'idle':    return 'idle';
    default:        return 'unknown';
  }
}
const stColor = s => STC[normStatus(s)] || STC.unknown;
// pane_id is a UUID (station id); show a short, stable prefix.
const shortId = id => String(id||'').split('-')[0].slice(0,8) || '—';
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const base = () => `seahelm/${S.mac}`;

// Edge stack (https://gw.seahelm.dev/): same-origin Host Gateway WSS.
// Pair links may still carry a legacy MQTT `b=`; ignore that on the gateway host.
function edgeBroker() {
  if (location.protocol === 'https:' && /\.(seahelm\.dev|ucar\.cc)$/i.test(location.hostname)) {
    return `wss://${location.host}/ws`;
  }
  return null;
}
if ($('broker') && edgeBroker()) $('broker').value = edgeBroker();

// Host Gateway (WSS /ws) vs MQTT devbroker. Force MQTT with ?mqtt=1 or localhost:28083.
function useGatewayTransport(url) {
  if (new URLSearchParams(location.search).get('mqtt') === '1') return false;
  try {
    const u = new URL(String(url).replace(/^ws/i, 'http'));
    if (u.hostname === 'localhost' && u.port === '28083') return false;
    if (u.pathname === '/ws' || u.pathname.endsWith('/ws')) return true;
  } catch { /* fall through */ }
  const q = new URLSearchParams(location.search).get('transport');
  const ls = localStorage.getItem('seahelm_transport');
  return q === 'gateway' || ls === 'gateway';
}
function isLinked(){
  if (S.transport === 'gateway') return !!(S.gw && S.gw.ready && S.gw.ws && S.gw.ws.readyState === WebSocket.OPEN);
  return !!S.client;
}
function disconnectAll(){
  if (S.gw && S.gw.ws) { S.gw.ws.close(); S.gw = null; }
  if (S.client) { S.client.end(true); S.client = null; }
  S.transport = null;
}

// ── logging ───────────────────────────────────────────────────────────────
// VT frames arrive per keystroke and per screen update, so leaving them in
// drowns everything worth reading — the log was a wall of `RX vt.data`. Filtered
// by default, with a switch for when the terminal stream is the thing you are
// debugging.
const VT_METHODS = new Set(['vt.data', 'vt.snapshot', 'pane.send_keys', 'pane.vt_keepalive']);
let showVTFrames = localStorage.getItem('seahelm_log_vt') === '1';

function setShowVTFrames(on){
  showVTFrames = on;
  localStorage.setItem('seahelm_log_vt', on ? '1' : '0');
  const btn = $('logVtBtn');
  if (btn){ btn.classList.toggle('on', on); btn.title = on ? '隐藏 VT 帧' : '显示 VT 帧'; }
}

function log(dir, topic, payload){
  if (!showVTFrames && VT_METHODS.has(String(topic))) return;
  const el = document.createElement('div');
  el.className = 'logline ' + dir;
  const body = typeof payload === 'string' ? payload : JSON.stringify(payload);
  const ts = new Date().toLocaleTimeString('en-GB');   // HH:MM:SS
  const head = document.createElement('div');
  head.className = 'll-head';
  head.textContent = `${ts} ${dir.toUpperCase()} ${topic}`;   // collapsed one-liner
  const bd = document.createElement('div');
  bd.className = 'll-body'; bd.textContent = body; bd.hidden = true;
  head.onclick = () => { bd.hidden = !bd.hidden; el.classList.toggle('open', !bd.hidden); };
  el.appendChild(head); el.appendChild(bd);
  $('log').prepend(el);   // newest on top (reverse-chronological)
}
function setStatus(on, txt){
  const s = $('status'); s.textContent = txt; s.className = on ? 'st-on' : 'st-off';
  // The gate is a function of connection state, so it re-renders wherever that
  // state is set — including the paths that drop the socket without asking.
  renderGate();
}

// ── connect ───────────────────────────────────────────────────────────────
function connect(){
  disconnectAll();
  S.mac = $('mac').value.trim() || 'testmac';
  const edge = edgeBroker();
  if (edge) $('broker').value = edge;
  const url = $('broker').value.trim();
  if (useGatewayTransport(url)) connectGateway(url);
  else connectMqtt(url);
}

function connectGateway(url){
  if (!S.authPass) return alert('Host Gateway 需要先配对(seahelm://pair?…)');
  S.transport = 'gateway';
  log('sys', '(connect)', url + ' [Gateway]');
  const ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  S.gw = { ws, ready: false, req: new Map(), n: 0, binary: false, deflate: false };
  ws.onopen = () => {
    // Opt in to the binary VT frame. An older Mac ignores these and keeps
    // sending JSON, which the message handler still understands.
    gwSend('auth', {
      mac_id: S.mac, token: S.authPass,
      vt_binary: true, vt_deflate: typeof DecompressionStream === 'function',
    }, (r, err) => {
      if (err || !r || r.ok === false) {
        setStatus(false, '认证失败');
        log('sys', '(auth-fail)', err ? JSON.stringify(err) : JSON.stringify(r));
        ws.close();
        return;
      }
      S.gw.ready = true;
      S.gw.binary = !!(r && r.vt_binary);
      S.gw.deflate = !!(r && r.vt_deflate);
      log('sys', '(vt format)', S.gw.binary ? (S.gw.deflate ? 'binary+deflate' : 'binary') : 'json+base64');
      setStatus(true, '已连接');
      gwSend('session.snapshot', {}, (snap) => {
        if (snap && snap.panes) applySessionSnapshot(snap);
      });
    });
  };
  ws.onmessage = (ev) => {
    if (ev.data instanceof ArrayBuffer) { onGatewayBinaryFrame(new Uint8Array(ev.data)); return; }
    try { onGatewayFrame(JSON.parse(ev.data)); } catch {}
  };
  ws.onclose = () => { setStatus(false, '离线'); S.gw = null; S.transport = null; };
  ws.onerror = () => setStatus(false, '错误');
}

function gwSend(method, params, onReply){
  if (!S.gw || !S.gw.ws || S.gw.ws.readyState !== WebSocket.OPEN) return;
  const id = 'g' + (++S.gw.n);
  const frame = { id, method, params };
  if (onReply) S.gw.req.set(id, onReply);
  S.gw.ws.send(JSON.stringify(frame));
  log('tx', method, frame);
}

// ── binary VT frames ──────────────────────────────────────────────────────
// Layout (see Sources/Core/HostGatewayVTFrame.swift):
//   u8 version | u8 flags (bit0 = deflate-raw) | u8 kind (1 data, 2 snapshot)
//   u8 keyLen  | key… | [snapshot only] u16 cols, u16 rows | payload
const VT_FRAME_VERSION = 1;

function parseVTFrame(buf){
  if (buf.length < 4 || buf[0] !== VT_FRAME_VERSION) return null;
  const flags = buf[1], kind = buf[2], keyLen = buf[3];
  let off = 4;
  if (buf.length < off + keyLen) return null;
  const key = new TextDecoder().decode(buf.subarray(off, off + keyLen));
  off += keyLen;
  let cols, rows;
  if (kind === 2){
    if (buf.length < off + 4) return null;
    cols = (buf[off] << 8) | buf[off+1];
    rows = (buf[off+2] << 8) | buf[off+3];
    off += 4;
  }
  return {
    type: kind === 2 ? 'vt.snapshot' : 'vt.data',
    key, cols, rows,
    deflated: (flags & 1) !== 0,
    body: buf.subarray(off),
  };
}

async function inflateRaw(bytes){
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// Inflation is async, and a terminal that applies two chunks out of order is
// corrupted — not slow, corrupted. Every frame for a pane is therefore threaded
// through one promise chain, so decode can overlap but application cannot.
const vtWriteChains = new Map();

function onGatewayBinaryFrame(buf){
  const f = parseVTFrame(buf);
  if (!f) { log('sys', '(vt)', `unparseable binary frame, ${buf.length}B`); return; }
  log('rx', f.type, `${f.type} ${f.body.length}B${f.deflated ? ' deflated' : ''} (payload elided)`);

  const prior = vtWriteChains.get(f.key) || Promise.resolve();
  const next = prior.then(async () => {
    const bytes = f.deflated ? await inflateRaw(f.body) : f.body;
    handleVT(f.key, { type: f.type, bytes, cols: f.cols, rows: f.rows });
  }).catch((e) => log('sys', '(vt)', `frame dropped: ${e && e.message}`));
  vtWriteChains.set(f.key, next);
}

function onGatewayFrame(msg){
  if (msg.type === 'notify') {
    const p = msg.params || {};
    // Size from the base64 length, not by decoding it: log() discards VT frames
    // by default, but arguments are evaluated first, so this line used to decode
    // every single payload a second time and throw the result away.
    const elide = p.b64 ? `${msg.method} ${b64Size(p.b64)}B (payload elided)` : msg.params;
    log('rx', msg.method, elide);
    onGatewayNotify(msg.method, p);
    return;
  }
  const cb = msg.id && S.gw && S.gw.req.get(msg.id);
  if (cb) {
    S.gw.req.delete(msg.id);
    log('rx', msg.id, msg.error || msg.result);
    cb(msg.result, msg.error || null);
    return;
  }
  log('rx', '(frame)', msg);
}

function onGatewayNotify(method, params){
  // Open questions / suggestions. MQTT delivered these as retained topics; over
  // the socket the Mac pushes them and replays whatever is open on auth.
  if (method === 'pane.event') {
    const key = params.pane_session_key || params.pane_id;
    if (!key) return;
    if (params.cleared) S.events.delete(key);
    else S.events.set(key, params);
    renderSuggestions();
    return;
  }
  if (method === 'vt.snapshot' || method === 'vt.data') {
    const key = params.pane_session_key || params.pane_id;
    handleVT(key, {
      type: method === 'vt.snapshot' ? 'vt.snapshot' : 'vt.data',
      b64: params.b64, cols: params.cols, rows: params.rows,
    });
  }
}

/** Ask the Mac to group the fleet the way its dashboard would. */
function refreshGroups(){
  if (S.transport !== 'gateway' || !isLinked()) { renderTree(); return; }
  const mode = S.grouping.mode;
  sendCommand('fleet.groups', { mode }, (r) => {
    if (S.grouping.mode !== mode) return;            // mode changed while in flight
    S.grouping.groups = (r && r.ok !== false && r.result && r.result.groups) || null;
    renderTree();
  });
}
function setGroupingMode(mode){
  S.grouping.mode = mode;
  localStorage.setItem('seahelm_grouping', mode);
  syncModeButtons();
  refreshGroups();
}
function syncModeButtons(){
  for (const b of document.querySelectorAll('#fmModes button'))
    b.classList.toggle('on', b.dataset.mode === S.grouping.mode);
}
for (const b of document.querySelectorAll('#fmModes button'))
  b.onclick = () => setGroupingMode(b.dataset.mode);
syncModeButtons();

function applySessionSnapshot(result){
  S.panes.clear();
  for (const p of (result.panes || [])) {
    const key = p.pane_session_key || p.pane_id;
    if (key) S.panes.set(key, p);
  }
  refreshGroups();
}

function connectMqtt(url){
  // A restored session has no E2EE key — it is never persisted — so the MQTT
  // path would silently fall back to plaintext. Re-pair instead: quietly
  // downgrading someone's encryption is worse than asking for the link again.
  if (S.authPass && !S.encKey){
    log('sys', '(mqtt)', '恢复的会话没有 E2EE 密钥,请重新配对后再用 MQTT');
    setStatus(false, '需重新配对');
    return;
  }
  S.transport = 'mqtt';
  // Paired → broker creds are HKDF-derived (username = mac_id, password = hex).
  // Self-hosted EMQX currently allows any user/pass (no authenticator yet).
  const opts = { clean:true, connectTimeout:6000, reconnectPeriod:2000,
    username: S.authPass ? S.mac : ($('user').value || undefined),
    password: S.authPass ? S.authPass : ($('pass').value || undefined) };
  log('sys', '(connect)', url + (S.encKey ? ' [E2EE]' : ''));
  const c = wrapClient(mqtt.connect(url, opts));
  S.client = c;
  c.on('connect', () => { setStatus(true,'已连接'); const t=`${base()}/#`; c.subscribe(t,{qos:1});
    log('sys','(subscribe)', t); });
  c.on('reconnect', () => setStatus(false,'重连中…'));
  c.on('close', () => setStatus(false,'离线'));
  c.on('error', e => { setStatus(false,'错误'); log('sys','(error)', String(e)); });
  // Inbound: decrypt before routing (topic = AES-GCM AAD). Empty = retained-delete.
  c.on('message', async (topic, buf) => {
    let raw = buf.toString();
    if (S.encKey && raw) {
      try { raw = await E2EE.open(S.encKey, topic, raw); }
      catch { log('sys', '(decrypt-fail)', topic); return; }
    }
    onMessage(topic, raw);
  });
}

// Transparently seal outbound string payloads (serialized so publish order holds).
function wrapClient(c){
  const rawPub = c.publish.bind(c);
  let chain = Promise.resolve();
  c.publish = (t, p, opts, cb) => {
    if (!S.encKey || typeof p !== 'string') return rawPub(t, p, opts, cb);
    chain = chain.then(async () => rawPub(t, await E2EE.seal(S.encKey, t, p), opts||{}, cb));
    return c;
  };
  return c;
}

// ── pairing ─────────────────────────────────────────────────────────────────
// Apply a `seahelm://pair?...` link: derive broker creds + E2EE key, fill fields,
// persist for next load. This is the whole "login" — no account, no session.
// What survives a reload is the *derived* gateway credential, never the pair
// link. The link carries the root secret, and the root secret is the thing that
// can mint every other key — for this gateway and for whatever a future version
// derives. Anything running on this origin can read localStorage, so keeping the
// root there means one injected script (a Cloudflare beacon, an extension, an
// XSS) walks away with permanent, total control of every pane.
//
// The auth token is scoped: it opens this gateway and nothing else, and rotating
// the pairing invalidates it. The E2EE key is not stored at all — WebCrypto
// imports it non-extractable, which is the right default and one we do not fight.
const CREDS_KEY = 'seahelm_creds';
try { localStorage.removeItem('seahelm_pair'); } catch (e) {}   // drop the old plaintext

async function applyPair(link){
  const p = E2EE.parsePairURI(link);
  const { password, encKey } = await E2EE.deriveKeys(p.rootBytes);
  S.encKey = encKey; S.authPass = password; S.mac = p.mac;
  $('broker').value = edgeBroker() || p.broker; $('mac').value = p.mac;
  $('user').value = p.mac; $('pass').value = '';
  try {
    localStorage.setItem(CREDS_KEY, JSON.stringify({ b: p.broker, m: p.mac, t: password }));
  } catch (e) {}
  log('sys', '(paired)', `${p.mac} · E2EE on`);
  renderGate();
}

/** Restore without the root secret: enough to authenticate, not to re-derive. */
function restoreCreds(){
  let c;
  try { c = JSON.parse(localStorage.getItem(CREDS_KEY) || 'null'); } catch (e) { c = null; }
  if (!c || !c.t || !c.m) return false;
  S.authPass = c.t; S.mac = c.m; S.encKey = null;
  $('broker').value = edgeBroker() || c.b || ''; $('mac').value = c.m;
  $('user').value = c.m; $('pass').value = '';
  return true;
}
function pairPrompt(){
  const link = prompt('粘贴 macOS 配对界面的长链接(seahelm://pair?…):', '');
  if (!link) return;
  applyPair(link.trim()).catch(e => alert('配对失败:' + e.message));
}
function clearPair(){
  S.encKey = null; S.authPass = null;
  localStorage.removeItem(CREDS_KEY);
  localStorage.removeItem('seahelm_pair');   // pre-migration installs
  log('sys', '(unpaired)', '回到明文/手填模式');
  renderGate();
}
// Reflect pairing state in the header: chip when paired, 配对 button when not.
/**
 * Connection gate. Pairing and connecting used to be two buttons in a corner,
 * which asked the user to know they were two steps — the first one exactly once,
 * and never again. Now the page has three states and shows only the one you are
 * in: paste a link, or press connect, or get out of the way entirely.
 */
function renderGate(){
  const gate = $('gate');
  if (!gate) return;

  if (isLinked()){                       // connected — the fleet is the page
    gate.hidden = true;
    gate.innerHTML = '';
    return;
  }
  gate.hidden = false;

  if (S.authPass){                       // paired, disconnected
    gate.innerHTML = `
      <div class="gate-card">
        <div class="gate-mac"><span class="lock">🔒</span><b>${esc(S.mac)}</b><span class="e2ee">E2EE</span></div>
        <button class="gate-primary" id="gateConnect">连接</button>
        <button class="gate-link" id="gateUnpair">解除配对</button>
      </div>`;
    $('gateConnect').onclick = () => { connect(); renderGate(); };
    $('gateUnpair').onclick = () => { clearPair(); };
    return;
  }

  gate.innerHTML = `
    <div class="gate-card">
      <div class="gate-title">配对这台 Mac</div>
      <div class="gate-hint">粘贴 Seahelm 设置里的配对链接(seahelm://pair?…)</div>
      <textarea class="gate-input" id="gateLink" rows="3" spellcheck="false"
                placeholder="seahelm://pair?b=…&amp;m=…&amp;k=…"></textarea>
      <button class="gate-primary" id="gatePair">配对并连接</button>
      <div class="gate-error" id="gateError" hidden></div>
    </div>`;
  const input = $('gateLink'), err = $('gateError');
  const fail = (m) => { err.textContent = m; err.hidden = false; };

  const go = async () => {
    const link = (input.value || '').trim();
    if (!link) return fail('请先粘贴配对链接');
    err.hidden = true;
    try {
      await applyPair(link);
      connect();                         // one action, not two
      renderGate();
    } catch (e) {
      // The usual cause is a page served without a secure context, where
      // SubtleCrypto does not exist and e2ee.js never finished loading.
      fail(typeof E2EE === 'undefined'
        ? '此页面不在安全上下文中,无法计算配对密钥 —— 请用 https:// 或 http://127.0.0.1 打开'
        : '配对失败:' + (e && e.message));
    }
  };
  $('gatePair').onclick = go;
  input.onkeydown = (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) go(); };
  setTimeout(() => input.focus(), 0);
}

function onMessage(topic, raw){
  const parts = topic.split('/');
  const seg = parts.slice(2);
  // The `#` subscription hands us back the commands we just published. We log
  // those on the way out and there is no inbound-command handler here, so this
  // is pure echo — and at one command per keystroke it buried the panel.
  if (seg[0]==='command') return;
  // VT chunks arrive many times a second — logging each payload would drown the
  // panel and dominate the profile. Log a one-line size receipt instead.
  if (seg[0]==='pane' && seg[2]==='vt'){
    let v; try { v = JSON.parse(raw); } catch { return; }
    if (!v) return;
    log('rx', topic, `${v.type||'vt.data'} ${v.b64 ? b64Size(v.b64) : 0}B (payload elided)`);
    handleVT(seg[1], v);
    return;
  }
  log('rx', topic, raw);
  let m; try { m = raw ? JSON.parse(raw) : null; } catch { m = raw; }
  if (seg[0]==='pane' && seg[2]==='status'){
    if (!raw) S.panes.delete(seg[1]); else S.panes.set(seg[1], m);
    renderTree();
  } else if (seg[0]==='pane' && seg[2]==='message'){
    // The feed is gone; a pane message only matters as an activity signal now.
  } else if (seg[0]==='pane' && seg[2]==='event'){
    if (!raw) S.events.delete(seg[1]); else S.events.set(seg[1], m);
    renderTree();
  } else if (seg[0]==='worktree' && seg[2]==='status'){
    if (!raw) S.worktrees.delete(seg[1]); else S.worktrees.set(seg[1], m); renderTree();
  } else if (seg[0]==='focus'){ S.focus = m; // retained for MQTT sync; UI uses First Mate header
  } else if (seg[0]==='dnd'){ S.dnd = m;
  } else if (seg[0]==='reply'){
    const corr = seg[seg.length-1];
    const onReply = cmdReq.get(corr);
    if (onReply){ cmdReq.delete(corr); onReply(m); }
  }
}

// ── render ─────────────────────────────────────────────────────────────────
// Rollup priority mirrors SailorStatus.priority (waiting > error > exited > running > idle).
const ST_PRI = {waiting:0, failed:1, done:2, running:3, idle:4, unknown:5};
function highestStatus(statuses){
  let best = 'unknown', bestPri = 99;
  for (const s of statuses){
    const n = normStatus(s);
    const p = ST_PRI[n] ?? 4;
    if (p < bestPri){ bestPri = p; best = n; }
  }
  return best;
}
function updateFirstMateHeader(rows){
  // Verbatim from DashboardOverviewView.render: "N · M running", and just "N"
  // when nothing is running — no "projects" noun, the count stands alone.
  const fleet = rows || buildFleet();
  const running = fleet.filter(r => normStatus(r.status) === 'running').length;
  $('fmSub').textContent = running > 0 ? `${fleet.length} · ${running} running` : `${fleet.length}`;
}
function renderSuggestCard(pid, e){
  const box=document.createElement('div'); box.className='ev';
  const p = S.panes.get(pid)||{};
  const label = (p.title||'').trim() || shortId(p.pane_id||pid);
  const meta = [p.project, p.branch].filter(Boolean).join(' · ');
  const method = e.type==='question' ? 'question.answer' : 'suggest.pick';
  box.innerHTML=`<div class="eb">${esc(e.type||'suggest')}`
    + `<button class="ev-x" title="放弃这条建议">✕</button></div>`
    + `<div class="ev-meta">${esc(label)}${meta?' · '+esc(meta):''}</div>`
    + `<div class="prompt">${esc(e.prompt||e.message||'')}</div>`;
  // Tapping the card jumps to the pane that asked, so you can see the context
  // before answering.
  box.onclick=(ev)=>{ if (ev.target.closest('button')) return; selectPaneByKey(pid); };
  // The dock floats over the terminal, so without this the only way out is to
  // pick an option — which types into the pane. Declining has to be free.
  box.querySelector('.ev-x').onclick=(ev)=>{
    ev.stopPropagation();
    S.events.delete(pid);          // optimistic: the card goes now
    renderSuggestions();
    sendCommand('decision.dismiss', { pane_session_key: pid });
  };
  (e.options||[]).forEach((opt,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.innerHTML=`<b>${i}</b>${esc(opt)}`;
    b.onclick=(ev)=>{ ev.stopPropagation();
      selectPaneByKey(pid);
      // Addressed by pane: a question is answered by driving that pane's prompt,
      // a suggestion by typing the option we were shown.
      sendCommand(method, { pane_session_key: pid, index: i });
    };
    box.appendChild(b);
  });
  return box;
}
function renderSuggestions(){
  // Docked to the bottom of the page, not to a column: a suggestion is the one
  // thing that must be reachable no matter which pane you are looking at.
  const host = $('suggestDock'); host.innerHTML='';
  for (const [pid,e] of S.events){
    if (!e) continue;
    host.appendChild(renderSuggestCard(pid, e));
  }
}

// ── First Mate list ────────────────────────────────────────────────────────
// A port of DashboardOverviewView's "Group by Sailor" mode: repository groups,
// one row per worktree, and — only where a worktree owns more than one pane —
// an indented row per pane. Metrics and colours come from the Swift source, not
// from eyeballing a screenshot.

/** SailorDisplayHelpers.relativeAge — coarse age for anything not running. */
function relativeAge(sinceEpoch){
  if (!sinceEpoch) return '';
  const secs = Math.max(0, Math.floor(Date.now()/1000 - sinceEpoch));
  if (secs < 10) return 'just now';
  if (secs < 60) return `${secs}s`;
  const mins = Math.floor(secs/60);
  if (mins < 60) return `${mins}m`;
  const hours = Math.floor(mins/60);
  if (hours < 24) return `${hours}h`;
  return `${Math.floor(hours/24)}d`;
}
/** SailorDisplayHelpers.compactDuration — precise running timer. */
function compactDuration(sinceEpoch){
  if (!sinceEpoch) return '';
  const total = Math.max(0, Math.floor(Date.now()/1000 - sinceEpoch));
  const h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
  if (h > 0) return `${h}h${String(m).padStart(2,'0')}m`;
  if (m > 0) return `${m}m${String(s).padStart(2,'0')}s`;
  return `${s}s`;
}
/** "+adds −dels  ↑ahead↓behind", coloured; empty when nothing diverged. */
function gitInfoHTML(g){
  if (!g) return '';
  const bits = [];
  if (g.added > 0) bits.push(`<span class="add">+${g.added}</span>`);
  if (g.removed > 0) bits.push(`<span class="del">−${g.removed}</span>`);
  let ab = '';
  if (g.ahead > 0) ab += `↑${g.ahead}`;
  if (g.behind > 0) ab += `↓${g.behind}`;
  const head = bits.join(' ');
  return head + (ab ? (head ? '  ' : '') + `<span class="ab">${ab}</span>` : '');
}
/** Status dot: a spinning arc for running, the SailorStatus glyph otherwise. */
function statusDotHTML(status, cls){
  const st = normStatus(status);
  return st === 'running'
    ? `<span class="${cls}"><span class="fm-spin"></span></span>`
    : `<span class="${cls}" style="color:${STC[st]||STC.unknown}">${STG[st]||STG.unknown}</span>`;
}

/** Collapse panes + worktree records into the rows the list draws. */
function buildFleet(){
  const byPath = new Map();
  for (const [key,p] of S.panes){
    const path = p.worktree_path || p.branch || p.project || '—';
    if (!byPath.has(path)) byPath.set(path, { path, panes:[], wt:null });
    byPath.get(path).panes.push([key, p]);
  }
  // Worktree records carry the git stats and start time panes don't have.
  for (const [,w] of S.worktrees){
    if (!w) continue;
    const path = w.worktree_path || w.worktree_id;
    if (!byPath.has(path)) byPath.set(path, { path, panes:[], wt:null });
    byPath.get(path).wt = w;
  }
  const rows = [];
  for (const entry of byPath.values()){
    const w = entry.wt || {};
    const lead = (entry.panes[0] || [])[1] || {};
    const statuses = entry.panes.map(([,p]) => p.status);
    rows.push({
      path: entry.path,
      // DashboardOverviewView's own fallback for a worktree with no deck.
      project: w.project || lead.project || 'Unknown deck',
      branch: w.branch || lead.branch || '',
      title: w.title || (entry.path.split('/').pop() || entry.path),
      status: w.status || (statuses.length ? highestStatus(statuses) : 'unknown'),
      startedAt: w.started_at || null,
      git: w.git || null,
      paneCount: w.pane_count || entry.panes.length,
      panes: entry.panes,
    });
  }
  return rows;
}

/**
 * Groups to draw. The Mac's own grouping (fleet.groups) wins, so the list shows
 * exactly what the dashboard shows — including "Needs input" or "Recent hour"
 * headers this side never computes. The local fallback is repository order, the
 * mode the desktop also starts in, for MQTT/offline sessions.
 */
function groupsToRender(rows){
  const byPath = new Map(rows.map(r => [r.path, r]));
  const server = S.grouping.groups;
  if (server && server.length){
    return server.map(g => ({
      title: g.title,
      status: g.status || null,
      isRepo: String(g.id || '').startsWith('repository:'),
      rows: (g.items || []).map(i => byPath.get(i.worktree_path)).filter(Boolean),
    })).filter(g => g.rows.length);
  }
  const local = new Map();
  for (const r of rows){
    if (!local.has(r.project)) local.set(r.project, []);
    local.get(r.project).push(r);
  }
  for (const list of local.values()) list.sort((a,b) => (b.startedAt||0) - (a.startedAt||0));
  return [...local.entries()].sort((a,b) => a[0].localeCompare(b[0]))
    .map(([title, list]) => ({ title, status:null, isRepo:true, rows:list }));
}

function renderTree(){
  const t = $('tree'); t.innerHTML='';
  const rows = buildFleet();
  updateFirstMateHeader(rows);
  if (!rows.length){ t.innerHTML='<div class="muted">无 pane</div>'; renderSuggestions(); return; }

  for (const group of groupsToRender(rows)){
    const g = document.createElement('div'); g.className='fm-group';
    const head = document.createElement('div'); head.className='fm-group-head';
    head.innerHTML = (group.status ? statusDotHTML(group.status, 'fm-dot') : '')
      + `<span class="fm-deck">${esc(group.title)}</span>`
      + (group.isRepo ? `<button class="fm-add" title="新建 worktree">+</button>` : '');
    // The Mac opens the helm prefilled with `/worktree @<project>`; the web has
    // no helm, so this is deliberately inert rather than pretending to work.
    const add = head.querySelector('.fm-add');
    if (add) add.onclick = (e) => {
      e.stopPropagation();
      log('sys','(not wired)', `新建 worktree @${group.title} —— web 端暂未接`);
    };
    g.appendChild(head);

    const box = document.createElement('div'); box.className='fm-rows';
    for (const r of group.rows){
      const sel = S.sel === r.path;
      const row = document.createElement('div');
      row.className = 'fm-row' + (sel ? ' sel' : '');
      const timeText = normStatus(r.status) === 'running'
        ? compactDuration(r.startedAt) : relativeAge(r.startedAt);
      const git = gitInfoHTML(r.git);
      row.innerHTML =
        statusDotHTML(r.status, 'fm-dot') +
        `<span class="fm-txt">
           <span class="fm-l1">
             <span class="fm-name">${esc(r.title)}</span>
             <span class="fm-time" data-started="${r.startedAt||''}" data-status="${esc(r.status)}">${esc(timeText)}</span>
           </span>
           <span class="fm-l2">
             <span class="fm-deck-tag" style="color:${deckColor(r.project)}">${esc(r.project)}</span>
             <span class="fm-branch">${esc(r.branch)}</span>
             <span class="fm-git">${git}</span>
             <span class="fm-sailors">${r.paneCount > 0 ? r.paneCount + ' sailors' : '—'}</span>
           </span>
         </span>`;
      row.onclick = () => selectWorktree(r);
      box.appendChild(row);

      // Third level only when the worktree owns more than one pane — a lone
      // pane is already represented by the worktree row itself.
      if (r.panes.length > 1){
        for (const [key,p] of r.panes){
          const pr = document.createElement('div');
          pr.className = 'fm-pane' + (S.selPane === key ? ' sel' : '');
          pr.innerHTML = statusDotHTML(p.status, 'pdot')
            + `<span class="ptitle">${esc((p.title||'').trim() || shortId(p.pane_id||key))}</span>`;
          pr.onclick = (e) => { e.stopPropagation(); selectWorktree(r, key); };
          box.appendChild(pr);
        }
      }
    }
    g.appendChild(box);
    t.appendChild(g);
  }
  renderSuggestions();
}

/** Narrow layouts hide First Mate behind a drawer; wide ones ignore the class. */
function setDrawer(open){
  $('leftcol').classList.toggle('open', open);
  $('scrim').classList.toggle('on', open);
}

/** Selecting anything in the list means: show that pane's terminal. */
function selectWorktree(row, paneKey){
  S.sel = row.path;
  S.selPane = paneKey || (row.panes[0] || [])[0] || null;
  renderTree();
  renderDetail();
  setDrawer(false);      // on a phone the list is covering the terminal it just opened
}
/** Same, addressed by pane key — used by the suggestion dock. */
function selectPaneByKey(key){
  const row = buildFleet().find(r => r.panes.some(([k]) => k === key));
  if (row) selectWorktree(row, key);
}

// Every pane is drawn at whatever size its slot in the mirrored layout gives it,
// so a window resize means refitting all of them, not one.
window.addEventListener('resize', handleViewportResize);

/** Rotating a phone or dragging a window can cross the mirror/single threshold. */
function handleViewportResize(){
  const wrap = $('termWrap');
  if (S.vt.tree && wrap){
    const want = layoutFitsMirror(S.vt.tree, wrap.clientWidth) ? 'mirror' : 'single';
    if (want !== S.vt.mode){
      const keep = S.vt.focus, tree = S.vt.tree, path = S.vt.worktree;
      unmountPanes();
      mountPanes(tree, keep, path);
      return;
    }
  }
  fitAllPanes();
}

/** Retick the elapsed labels in place — no re-render, no scroll jump. */
function tickTimes(){
  for (const el of document.querySelectorAll('.fm-time[data-started]')){
    const started = Number(el.dataset.started || 0);
    if (!started) continue;
    el.textContent = normStatus(el.dataset.status) === 'running'
      ? compactDuration(started) : relativeAge(started);
  }
}
setInterval(tickTimes, 1000);

// ── Renderer (spike) ────────────────────────────────────────────────────────
// `?renderer=ghostty` swaps xterm.js for ghostty-web, which runs Ghostty's own
// VT parser compiled to wasm and draws with Canvas 2D. Worth evaluating here
// specifically because this client is a *mirror*: the Mac parses the same PTY
// bytes with libghostty, so any disagreement between the two parsers is a
// correctness bug in the mirror rather than a matter of taste.
//
// Not a swap — a switch. ghostty-web has no touch handlers at all, so mobile is
// a known regression, and it is young enough that the comparison has to be made
// on real panes before anything is decided.
const RENDERER = (() => {
  const q = new URLSearchParams(location.search).get('renderer');
  if (q === 'ghostty' || q === 'xterm'){ localStorage.setItem('seahelm_renderer', q); return q; }
  return localStorage.getItem('seahelm_renderer') || 'xterm';
})();

let TerminalCtor = null;
let rendererReady = null;

/** Resolve the terminal implementation once. Both expose the xterm.js surface. */
function ensureRenderer(){
  if (rendererReady) return rendererReady;
  if (RENDERER !== 'ghostty'){
    TerminalCtor = window.Terminal;
    rendererReady = Promise.resolve('xterm');
    return rendererReady;
  }
  rendererReady = import('./vendor/ghostty-web.js')
    .then(async (mod) => {
      await mod.init();                 // wasm is inlined; nothing is fetched
      TerminalCtor = mod.Terminal;
      log('sys', '(renderer)', 'ghostty-web — Ghostty VT parser (wasm) + Canvas 2D');
      return 'ghostty';
    })
    .catch((e) => {
      // Falling back is the right failure mode for a spike: an experimental
      // renderer that will not load must not take the client down with it.
      TerminalCtor = window.Terminal;
      log('sys', '(renderer failed)', `ghostty-web 加载失败,回退 xterm.js: ${e && e.message}`);
      return 'xterm';
    });
  return rendererReady;
}

function renderRendererBadge(active){
  const el = $('rendererBadge');
  if (!el) return;
  el.textContent = active === 'ghostty' ? 'ghostty-web' : 'xterm.js';
  el.title = active === 'ghostty'
    ? 'Ghostty VT parser (wasm) + Canvas 2D — 点击切回 xterm.js'
    : 'xterm.js — 点击试用 ghostty-web';
  el.className = 'renderer-badge' + (active === 'ghostty' ? ' alt' : '');
  el.onclick = () => {
    const next = active === 'ghostty' ? 'xterm' : 'ghostty';
    location.search = new URLSearchParams({ renderer: next }).toString();
  };
}

// Resolve the renderer once the declarations above exist: `rendererReady` is a
// `let`, so any call placed earlier in the file hits its temporal dead zone.
ensureRenderer().then(renderRendererBadge);

// ── Shortcut bar ────────────────────────────────────────────────────────────
// Some keys never reach a web page. Cmd+W closes the tab and is unpreventable
// in every major browser; Cmd+D is the bookmark shortcut. Neither can be bound
// here, and both are real seahelm actions (split / close a pane), so the only
// way to offer them is a button that calls the control API directly.
//
// The terminal keys beside them are a different case — they do reach xterm and
// work when a pane holds focus. They are here because focus is easy to lose in
// a browser (click the list, and Esc or ^C go nowhere), and because on a phone
// there is no Ctrl key at all.

/** Raw bytes: what a real key press would have produced. */
const TERM_KEYS = [
  { label: 'Esc',  bytes: '\x1b',     title: 'Escape — 中断 Claude 的当前输出' },
  { label: '^C',   bytes: '\x03',     title: 'Ctrl+C — 中断前台进程' },
  { label: '^D',   bytes: '\x04',     title: 'Ctrl+D — EOF' },
  { label: '⇥',    bytes: '\t',       title: 'Tab — 补全(浏览器会拿 Tab 切焦点)' },
  { label: '⇧⇥',   bytes: '\x1b[Z',   title: 'Shift+Tab — Claude Code 切换权限模式' },
  { label: '↑',    bytes: '\x1b[A',   title: '上箭头 — 历史命令' },
];

function renderTermKeys(){
  const bar = $('termKeys');
  if (!bar) return;
  bar.innerHTML = '';
  const focused = S.vt.focus;
  const live = !!(focused && S.vt.panes.has(focused) && isLinked());

  for (const k of TERM_KEYS){
    const b = document.createElement('button');
    b.textContent = k.label;
    b.title = k.title;
    b.disabled = !live;
    b.onclick = () => sendRawKey(k.bytes);
    bar.appendChild(b);
  }

  const copy = document.createElement('button');
  copy.textContent = '⧉';
  copy.title = '复制选区(手机上没有 ⌘C)';
  copy.disabled = !live;
  copy.onclick = () => copySelection();
  bar.appendChild(copy);

  const sep = document.createElement('span');
  sep.className = 'sep';
  bar.appendChild(sep);

  const split = document.createElement('button');
  split.textContent = '⌘D';
  split.title = '分屏 — 在 Mac 上把这个 pane 一分为二';
  split.disabled = !live;
  split.onclick = () => paneAction('pane.split', { direction: 'right', focus: false });
  bar.appendChild(split);

  const close = document.createElement('button');
  close.textContent = '⌘W';
  close.className = 'danger';
  close.title = '关闭这个 pane';
  close.disabled = !live;
  close.onclick = () => {
    const name = (S.panes.get(S.vt.focus) || {}).title || S.vt.focus;
    // Closing takes a running agent with it, and the button is one click from
    // every other button on this bar.
    if (!confirm(`关闭 pane「${name}」?其中正在运行的进程会被终止。`)) return;
    paneAction('pane.close', {});
  };
  bar.appendChild(close);
}

/** Button path: no `copy` event to hijack, so write the clipboard directly. */
function copySelection(){
  const entry = S.vt.focus ? S.vt.panes.get(S.vt.focus) : null;
  if (!entry) return;
  const text = entry.term.getSelection();
  if (!text){ log('sys', '(copy)', '没有选中内容'); return; }
  // Requires a secure context, which the page already needs for pairing anyway.
  navigator.clipboard.writeText(text)
    .then(() => log('sys', '(copy)', `已复制 ${text.length} 字符`))
    .catch((e) => log('sys', '(copy failed)', String(e && e.message)));
  try { entry.term.focus(); } catch (e) {}
}

function sendRawKey(bytes){
  const key = S.vt.focus;
  if (!key || !isLinked()) return;
  sendCommand('pane.send_keys',
    { pane_session_key: key, b64: bytesToB64(new TextEncoder().encode(bytes)) });
  const entry = S.vt.panes.get(key);
  if (entry) { try { entry.term.focus(); } catch (e) {} }   // hand the keyboard back
}

/** Structural changes happen on the Mac; we re-read the tree rather than guess. */
function paneAction(method, extra){
  const key = S.vt.focus;
  if (!key || !isLinked()) return;
  const pane = S.panes.get(key) || {};
  sendCommand(method, Object.assign({ pane_id: pane.pane_id || key }, extra), (r) => {
    if (r && r.ok === false){
      log('sys', '(pane action failed)', JSON.stringify(r.error || r));
      showActionToast((r.error && r.error.message) || '操作失败', true);
      return;
    }
    showActionToast(method === 'pane.split' ? '已分屏' : '已关闭 pane');
    const path = S.sel;
    S.vt.worktree = null;        // force a remount of the changed layout
    if (path) requestLayout(path);
  });
}

let actionToastTimer = null;
function showActionToast(message, isError){
  const toast = $('actionToast');
  if (!toast) return;
  toast.textContent = message;
  toast.classList.toggle('error', !!isError);
  toast.hidden = false;
  if (actionToastTimer) clearTimeout(actionToastTimer);
  actionToastTimer = setTimeout(() => { toast.hidden = true; }, 2600);
}

// ── Mirrored pane layout ────────────────────────────────────────────────────
// The mid column shows the whole worktree, not one pane: the Mac ships its live
// split tree (`layout.live`) and we rebuild it here as nested flex boxes. Two
// reasons this beats picking a pane and scaling it up. It is the same window the
// user already knows, and — less obviously — a slot in the mirrored tree has
// roughly the aspect ratio of the pane that lives in it, so fitting a grid into
// it stops being a fight. Dividers are deliberately inert: this is a mirror, and
// resizing belongs to the machine that owns the panes.

/** The mid column is the worktree. Selecting one mounts its whole layout. */
function renderDetail(){
  const head = $('detailHead'), wrap = $('termWrap');
  if (!S.sel){
    unmountPanes();
    head.textContent = '终端';
    wrap.classList.add('empty');
    wrap.innerHTML = '<div class="muted">选择一个 worktree</div>';
    renderTermKeys();
    return;
  }
  const row = buildFleet().find(r => r.path === S.sel);
  head.textContent = [row && row.project, row && row.branch].filter(Boolean).join(' · ') || S.sel;
  wrap.classList.remove('empty');
  // Already mirroring this worktree — a click inside it only moves focus.
  if (S.vt.worktree === S.sel){
    if (S.selPane && S.vt.panes.has(S.selPane)) focusPane(S.selPane);
    return;
  }
  requestLayout(S.sel);
}

/** Fetch the worktree's live tree; fall back to a stack if the Mac has none. */
function requestLayout(path){
  sendCommand('layout.live', { worktree_path: path }, (r) => {
    if (S.sel !== path) return;                    // selection moved while in flight
    const root = r && r.ok !== false && r.result && r.result.root;
    ensureRenderer().then((active) => {
      if (S.sel !== path) return;
      renderRendererBadge(active);
      if (!root){
        // No live tree (worktree closed on the Mac) — stack what we know of it.
        mountPanes(stackedTreeFor(path), null, path);
        return;
      }
      mountPanes(root, r.result.focused_pane_session_key || null, path);
    });
  });
}

/** Fallback shape: every known pane of the worktree, stacked top to bottom. */
function stackedTreeFor(path){
  const row = buildFleet().find(r => r.path === path);
  const keys = (row ? row.panes : []).map(([k]) => k).filter(Boolean);
  if (!keys.length) return null;
  return keys.map(k => ({ type:'leaf', pane_session_key:k }))
             .reduce((a, b) => ({ type:'split', axis:'vertical', ratio:0.5, first:a, second:b }));
}

// A terminal grid cannot reflow — the Mac fixes its column count — so a slot
// too narrow for that many columns does not wrap, it clips. Mirroring the
// desktop is right up until the point where every pane is showing half a line,
// which is what a 2-up split does on a phone: measured here, a pane in a
// 3-way split is 69 columns, and a 390px phone holds ~72 at the readable floor.
// One pane fits almost exactly; any split does not.
//
// So the trigger is the constraint itself rather than a device width: can every
// leaf show its columns at VT_FONT_MIN? A narrow window on a laptop degrades for
// the same reason a phone does, which is the honest generalisation.
const CELL_RATIO = 0.6;          // monospace advance ÷ font size, near enough
const ASSUMED_COLS = 80;         // prior before a pane has ever reported geometry

function treeLeaves(node, out){
  out = out || [];
  if (!node) return out;
  if (node.type === 'leaf') { out.push(node); return out; }
  treeLeaves(node.first, out);
  treeLeaves(node.second, out);
  return out;
}

/** Narrowest fraction of the container any leaf ends up with. */
function narrowestLeafFraction(node, share){
  share = share === undefined ? 1 : share;
  if (!node || node.type === 'leaf') return share;
  const ratio = Math.min(0.9, Math.max(0.1, Number(node.ratio) || 0.5));
  // Only a horizontal split divides width; a vertical one costs rows, and rows
  // are the axis a terminal is allowed to lose — it scrolls in that direction.
  const [a, b] = node.axis === 'horizontal'
    ? [share * ratio, share * (1 - ratio)]
    : [share, share];
  return Math.min(narrowestLeafFraction(node.first, a),
                  narrowestLeafFraction(node.second, b));
}

function layoutFitsMirror(tree, containerWidth){
  if (!tree || tree.type === 'leaf') return true;
  const leaves = treeLeaves(tree);
  const widestCols = leaves.reduce((m, leaf) => {
    const g = S.geom.get(leaf.pane_session_key);
    return Math.max(m, (g && g.cols) || ASSUMED_COLS);
  }, 0);
  const needed = widestCols * VT_FONT_MIN * CELL_RATIO;
  return narrowestLeafFraction(tree) * containerWidth >= needed;
}

function mountPanes(tree, focusKey, path){
  unmountPanes();
  const wrap = $('termWrap');
  wrap.innerHTML = '';
  if (!tree){
    wrap.classList.add('empty');
    wrap.innerHTML = '<div class="muted">无 pane</div>';
    return;
  }
  S.vt.worktree = path;
  S.vt.tree = tree;
  S.vt.mode = layoutFitsMirror(tree, wrap.clientWidth) ? 'mirror' : 'single';

  if (S.vt.mode === 'single'){
    const leaves = treeLeaves(tree);
    const wanted = leaves.find(l => l.pane_session_key === (focusKey || S.selPane)) || leaves[0];
    mountSinglePane(wanted && wanted.pane_session_key);
    return;
  }

  S.vt.scrollback = scrollbackForLeafCount(treeLeaves(tree).length);
  wrap.appendChild(buildLayoutNode(tree));
  openMountedPanes();
  focusPane(focusKey || S.selPane || S.vt.panes.keys().next().value || null);
  fitAllPanes();
}

/** Attach every pane the DOM now holds. */
function openMountedPanes(){
  for (const key of S.vt.panes.keys()){
    sendCommand('pane.vt_open', { pane_session_key: key, cols: VT_COLS, rows: VT_ROWS }, (r) => {
      if (r && r.ok === false) log('sys','(vt open failed)', JSON.stringify(r.error||r));
    });
  }
}

/**
 * One pane, full width, plus a strip to move between them.
 *
 * Only the visible pane is attached. That is not just tidiness: each attach is a
 * real client of the zmx session (#44), and the layouts that trigger this mode
 * are the ones on the weakest devices.
 */
function mountSinglePane(key){
  const wrap = $('termWrap');
  const leaves = treeLeaves(S.vt.tree);
  if (!key && leaves.length) key = leaves[0].pane_session_key;
  const leaf = leaves.find(l => l.pane_session_key === key) || leaves[0];
  if (!leaf) return;

  // Exactly one terminal lives at a time here, so depth costs 7.6 MB once.
  S.vt.scrollback = VT_SCROLLBACK_DEEP;

  // Drop the previous terminal first — its attach client goes with it.
  for (const [k, entry] of S.vt.panes){
    if (isLinked()) sendCommand('pane.vt_close', { pane_session_key: k });
    if (entry.flushT) clearTimeout(entry.flushT);
    try { entry.term.dispose(); } catch (e) {}
  }
  S.vt.panes.clear();

  wrap.innerHTML = '';
  wrap.appendChild(renderPaneStrip(leaf.pane_session_key));
  const holder = document.createElement('div');
  holder.className = 'vt-single';
  holder.appendChild(buildLayoutLeaf(leaf));
  wrap.appendChild(holder);

  openMountedPanes();
  focusPane(leaf.pane_session_key);
  fitAllPanes();
}

/** Tap targets standing in for the panes we are no longer drawing. */
function renderPaneStrip(activeKey){
  const strip = document.createElement('div');
  strip.className = 'pane-strip';
  for (const leaf of treeLeaves(S.vt.tree)){
    const key = leaf.pane_session_key;
    const known = S.panes.get(key) || {};
    const chip = document.createElement('button');
    chip.className = 'pane-chip' + (key === activeKey ? ' on' : '');
    chip.innerHTML = statusDotHTML(known.status || 'unknown', 'pdot')
      + `<span>${esc(leaf.title || known.title || shortId(known.pane_id || key))}</span>`;
    // Explicit tap, not a swipe: a horizontal drag belongs to whatever TUI is
    // running, and mis-swiping away from the pane you are reading is expensive.
    chip.onclick = () => { if (key !== S.vt.focus) mountSinglePane(key); };
    strip.appendChild(chip);
  }
  return strip;
}

function unmountPanes(){
  for (const [key, entry] of S.vt.panes){
    if (isLinked()) sendCommand('pane.vt_close', { pane_session_key: key });
    if (entry.flushT) clearTimeout(entry.flushT);
    try { entry.term.dispose(); } catch (e) {}
  }
  S.vt.panes.clear();
  S.vt.focus = null;
  S.vt.worktree = null;
  S.vt.tree = null;
  renderTermKeys();
}

function buildLayoutNode(node){
  if (!node) return document.createElement('div');
  if (node.type === 'leaf') return buildLayoutLeaf(node);
  const el = document.createElement('div');
  el.className = 'vt-split';
  // horizontal = left | right, vertical = top / bottom (SplitAxis in SplitNode.swift).
  el.style.flexDirection = node.axis === 'horizontal' ? 'row' : 'column';
  const ratio = Math.min(0.9, Math.max(0.1, Number(node.ratio) || 0.5));
  for (const [child, share] of [[node.first, ratio], [node.second, 1 - ratio]]){
    const slot = document.createElement('div');
    slot.className = 'vt-slot';
    slot.style.flex = share + ' 1 0';
    slot.appendChild(buildLayoutNode(child));
    el.appendChild(slot);
  }
  return el;
}

function buildLayoutLeaf(node){
  const key = node.pane_session_key;
  const el = document.createElement('div');
  el.className = 'vt-leaf';
  el.dataset.key = key;

  const bar = document.createElement('div');
  bar.className = 'vt-leaf-title';
  const known = S.panes.get(key) || {};
  bar.textContent = node.title || known.title || key;

  const host = document.createElement('div');
  host.className = 'vt-host';
  el.appendChild(bar); el.appendChild(host);

  const t = new TerminalCtor({
    cols:VT_COLS, rows:VT_ROWS, convertEol:false, scrollback:S.vt.scrollback,
    fontFamily:'ui-monospace, SFMono-Regular, Menlo, monospace', fontSize:VT_FONT_BASE,
    theme:{ background:'#05090c', foreground:'#c8d6d5' },
  });
  t.open(host);
  attachWebglRenderer(t);
  const entry = { term:t, el, host, pending:'', flushT:null };
  S.vt.panes.set(key, entry);

  // xterm only fires onData for the terminal that actually holds focus, so each
  // pane can own its own outbound path — no routing table, no focus bookkeeping.
  t.onData((data) => {
    entry.pending += data;
    if (entry.flushT) return;
    entry.flushT = setTimeout(() => {
      entry.flushT = null;
      const buf = entry.pending; entry.pending = '';
      if (!buf || !isLinked()) return;
      sendCommand('pane.send_keys',
        { pane_session_key: key, b64: bytesToB64(new TextEncoder().encode(buf)) });
    }, 10);
  });
  t.onScroll(() => { if (S.vt.focus === key) updateToBottom(); });
  el.addEventListener('mousedown', () => focusPane(key));

  // xterm paints its selection onto the canvas, so the browser has no DOM range
  // covering it. A native copy therefore falls back to whatever the browser does
  // consider selected — xterm's hidden helper textarea, which holds one row — and
  // the result is a multi-line selection that copies a single line. Feed the
  // clipboard the terminal's own selection instead. Covers ⌘C and the context
  // menu alike, since both raise `copy`.
  el.addEventListener('copy', (e) => {
    const text = t.getSelection();
    if (!text) return;
    e.clipboardData.setData('text/plain', text);
    e.preventDefault();
  });
  return el;
}

/**
 * Draw with the GPU where we can. The DOM renderer emits a span per cell, and
 * the mirrored layout multiplied the terminals on screen — the cost that used
 * to be paid once is now paid per pane, every frame.
 *
 * Every failure path here falls back rather than throws. Browsers cap live WebGL
 * contexts (Chrome around 16), so a big enough layout will legitimately run out,
 * and a lost context leaves a blank canvas behind if the addon stays attached.
 * A pane rendering by DOM is slower; a pane rendering nothing is broken.
 */
function attachWebglRenderer(term){
  if (RENDERER === 'ghostty') return;              // ghostty-web draws its own canvas
  if (typeof WebglAddon === 'undefined' || !WebglAddon.WebglAddon) return;
  try {
    const addon = new WebglAddon.WebglAddon();
    addon.onContextLoss(() => {
      log('sys', '(webgl)', 'context lost — 该面板回退到 DOM 渲染');
      try { addon.dispose(); } catch (e) {}
    });
    term.loadAddon(addon);
  } catch (e) {
    log('sys', '(webgl)', `不可用,回退 DOM 渲染: ${e && e.message}`);
  }
}

function focusPane(key){
  S.vt.focus = key;
  for (const [k, entry] of S.vt.panes) entry.el.classList.toggle('on', k === key);
  const entry = key && S.vt.panes.get(key);
  if (entry) { try { entry.term.focus(); } catch (e) {} }
  updateToBottom();
  renderTermKeys();
}

function fitAllPanes(){
  for (const entry of S.vt.panes.values()) fitPaneFont(entry);
}

/**
 * Scale one pane's font so its grid fills its slot.
 * The grid is dictated by the Mac side and cannot be renegotiated, so the only
 * free variable is how big we draw it — down from VT_FONT_BASE, never past it.
 * Constrains on BOTH axes and takes the tighter one: width alone lets a tall
 * session run off the bottom, height alone lets a wide one spill out the side.
 */
function fitPaneFont(entry){
  const t = entry.term;
  const screen = entry.host.querySelector('.xterm-screen');
  if (!screen) return;
  const box = screen.getBoundingClientRect();
  const availW = entry.host.clientWidth - 4, availH = entry.host.clientHeight - 4;
  if (!box.width || !box.height || availW <= 0 || availH <= 0) return;

  const scale = Math.min(availW / box.width, availH / box.height);
  let size = Math.max(VT_FONT_MIN, Math.min(VT_FONT_BASE, Math.floor(t.options.fontSize * scale)));
  if (size !== t.options.fontSize) t.options.fontSize = size;

  // xterm rounds cell metrics to whole pixels, so cell size is a step function of
  // font size and the linear guess can still overflow. Step down until it really
  // fits — but never past the readable floor, below which panning is the honest
  // answer rather than smaller type.
  for (let i = 0; i < 8 && size > VT_FONT_MIN; i++){
    const el = entry.host.querySelector('.xterm-screen');
    if (!el) return;
    const rect = el.getBoundingClientRect();
    if (rect.width <= availW && rect.height <= availH) break;
    size -= 1;
    t.options.fontSize = size;
  }
}

/** Decoded byte count straight from the base64 length — no decode. */
function b64Size(b64){
  const n = b64.length;
  if (!n) return 0;
  const pad = b64.charCodeAt(n-1) === 61 ? (b64.charCodeAt(n-2) === 61 ? 2 : 1) : 0;
  return (n / 4) * 3 - pad;
}

function b64ToBytes(b64){
  const s = atob(b64); const a = new Uint8Array(s.length);
  for (let i=0;i<s.length;i++) a[i]=s.charCodeAt(i);
  return a;
}
function bytesToB64(bytes){
  let s=''; for (let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]);
  return btoa(s);
}

/** Shared VT path for MQTT topic payloads and Gateway notify frames. */
function handleVT(paneKey, v){
  if (!v) return;
  const entry = S.vt.panes.get(paneKey);
  if (!entry) return;                       // a pane we are not mirroring right now
  // `bytes` from the binary frame (already decoded), `b64` from the JSON one.
  const bytes = v.bytes ? v.bytes : (v.b64 ? b64ToBytes(v.b64) : new Uint8Array(0));
  if (v.type !== 'vt.snapshot' && !bytes.length) return;
  const t = entry.term;
  if (v.type === 'vt.snapshot'){
    if (v.cols && v.rows){
      const was = S.geom.get(paneKey);
      if (!was || was.cols !== v.cols || was.rows !== v.rows){
        S.geom.set(paneKey, { cols: v.cols, rows: v.rows });
        saveGeom();
        // Learning a pane is wider than assumed can invalidate a mirror already
        // on screen; re-check rather than leave it clipping. Deferred a tick:
        // re-checking can dispose this very terminal, and the snapshot below
        // still has to be written to it.
        setTimeout(handleViewportResize, 0);
      }
      if (t.cols !== v.cols || t.rows !== v.rows){
        t.resize(v.cols, v.rows);
        log('sys','(vt resize)', `${v.cols}x${v.rows} — matched session geometry`);
      }
    }
    t.reset();
    if (bytes.length) t.write(bytes, () => fitPaneFont(entry));
    else fitPaneFont(entry);
    if (S.vt.focus === paneKey) updateToBottom();
    return;
  }
  t.write(bytes);
}

/** The "back to live" affordance tracks whichever pane has focus. */
function updateToBottom(){
  const btn = $('toBottom');
  if (!btn) return;
  const entry = S.vt.focus ? S.vt.panes.get(S.vt.focus) : null;
  if (!entry){ btn.classList.remove('on'); return; }
  const b = entry.term.buffer.active;
  btn.classList.toggle('on', b.viewportY < b.baseY);
}

// An attach client is a real client of the zmx session, so leaving one behind is
// not harmless — and mirroring a layout opens one per pane, which multiplies the
// cost of getting this wrong. vt_close covers the tidy exits; pagehide covers
// closing the tab; the bridge's lease sweep covers a crash, where neither runs.
window.addEventListener('pagehide', unmountPanes);
setInterval(() => {
  if (!isLinked()) return;
  for (const key of S.vt.panes.keys()) sendCommand('pane.vt_keepalive', { pane_session_key: key });
}, 20000);
// ── outbound (commands) ─────────────────────────────────────────────────────
let corrN=0;
const cmdReq = new Map();    // corr → onReply, for commands whose result we need
function sendCommand(method, params, onReply){
  if (S.transport === 'gateway') {
    if (!isLinked()) { alert('未连接'); return; }
    gwSend(method, params, (result, error) => {
      if (!onReply) return;
      onReply(error ? { ok: false, error } : { ok: true, result: result ?? {} });
    });
    return;
  }
  if(!S.client){ alert('未连接'); return; }
  const corr = 'w'+(++corrN);
  const reply_to = `${base()}/reply/web/${corr}`;
  const payload = { method, params, reply_to, corr };
  if (onReply) {
    cmdReq.set(corr, onReply);
    if (cmdReq.size > 200) cmdReq.delete(cmdReq.keys().next().value);
  }
  S.client.publish(`${base()}/command`, JSON.stringify(payload), {qos:1});
  log('tx', `${base()}/command`, payload);
}

// Debug panel is a developer surface — remembered per browser so it stays out
// of the way once you've dismissed it.
// Stored as "shown", absent meaning hidden. The previous key recorded the
// opposite and every browser that had ever touched the toggle carried a value
// for it, so flipping the default alone changed nothing for exactly the people
// who had used the thing. A new key is how a default actually moves.
const LOG_SHOWN_KEY = 'seahelm_log_shown';
try { localStorage.removeItem('seahelm_log_off'); } catch (e) {}

function logShown(){ return localStorage.getItem(LOG_SHOWN_KEY) === '1'; }

function applyLogVisibility(){
  // Hidden by default: it is a developer surface, and since the mirrored layout
  // it also costs the terminals ~380px — enough to push a worktree from a
  // mirrored split down to one pane at a time.
  const off = !logShown();
  document.querySelector('main').classList.toggle('nolog', off);
  const btn = $('logBtn');
  btn.classList.toggle('on', !off);
  btn.title = off ? '显示报文日志' : '隐藏报文日志';
  setTimeout(fitAllPanes, 200);   // the panes just got wider
}
$('disconnectBtn').onclick = () => {
  disconnectAll();
  unmountPanes();
  setStatus(false, '离线');
};
$('logBtn').onclick = () => {
  localStorage.setItem(LOG_SHOWN_KEY, logShown() ? '0' : '1');
  applyLogVisibility();
};
applyLogVisibility();
$('logVtBtn').onclick = () => setShowVTFrames(!showVTFrames);
setShowVTFrames(showVTFrames);
$('clearLog').onclick=()=>$('log').innerHTML='';
$('pubMock').onclick=pubMock;
</script>
</body>
</html>
