[package]
name = "seahelm-gpui"
description = "Prototype seahelm client in GPUI: talks to seahelmd directly and draws the grid itself"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "seahelm-gpui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
gpui = "0.2.2"
keep-vt = { path = "../../seahelmd/crates/keep-vt" }
seahelm-core-types = { path = "../../seahelmd/crates/core-types" }
seahelmd = { path = "../../seahelmd/crates/seahelmd" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
debug = 1

# Its own workspace: GPUI's dependency tree must not reach the daemon's
# `--locked` build.
[workspace]
