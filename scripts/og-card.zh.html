<style>
  :root{ --ink:#d8e8e8; --ink2:#8fb0b3; --accent:#1fc8da;
         --run:#1bb062; --wait:#e0a458; --idle:#5d7b7a; }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    width:1200px; height:630px; overflow:hidden;
    background:linear-gradient(180deg,#0a2c36 0%,#03141a 100%); color:var(--ink);
    font-family:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
    padding:64px 72px; display:flex; flex-direction:column;
  }
  .top{display:flex;align-items:center;gap:18px}
  .top svg{width:60px;height:60px;color:var(--ink)}
  .mark{font:700 40px/1 "IBM Plex Sans Condensed","PingFang SC",sans-serif;letter-spacing:-.01em}
  .eyebrow{margin-left:auto;font:500 15px/1 "IBM Plex Mono",monospace;
           letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
  h1{margin:46px 0 0;font:700 76px/1.2 "IBM Plex Sans Condensed","PingFang SC",sans-serif;
     letter-spacing:0;max-width:15em}
  .sub{margin:26px 0 0;font-size:23px;line-height:1.75;color:var(--ink2);max-width:36em}
  .strip{margin-top:auto;display:flex;gap:14px;align-items:stretch}
  .card{flex:1;border:1px solid #1b4d58;border-radius:9px;background:#0b2a33;
        padding:15px 17px;display:grid;gap:7px;align-content:start}
  .b{font:500 18px/1.2 "IBM Plex Mono",monospace}
  .p{font:400 16px/1.2 "IBM Plex Mono",monospace;color:var(--ink2)}
  .dom{margin-left:auto;align-self:flex-end;font:500 22px/1 "IBM Plex Mono",monospace;
       color:var(--accent);white-space:nowrap;padding-bottom:4px}
</style></head><body>
